
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GolViral - Create</title>
<style>
:root{--bg:#050505;--card:#0f0f0f;--accent:#00ff88;--text:#fff;--muted:#888;--border:#1f1f1f;--danger:#ff4444;--gradient:linear-gradient(135deg,#00ff88,#3b82f6)}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:var(--bg);color:var(--text);max-width:500px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
header{padding:16px;background:rgba(15,15,15,0.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.content{flex:1;overflow-y:auto;padding:20px}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.type-btn{border:1px solid var(--border);background:var(--card);border-radius:14px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:12px}
.type-btn.active{border-color:var(--accent);background:rgba(0,255,136,0.1)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:12px}
.input{width:100%;background:#000;border:1px solid var(--border);color:var(--text);padding:14px;border-radius:12px;margin-bottom:12px;outline:none}
.drop{border:2px dashed var(--border);border-radius:12px;height:320px;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;background:#000;position:relative;cursor:pointer}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;border-radius:12px;z-index:3}
.drop canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:3;border-radius:12px}
.drop-placeholder{display:flex;flex-direction:column;align-items:center;gap:8px;z-index:1;pointer-events:none}
.file-info{position:absolute;z-index:4;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.9));padding:12px;display:none}
.progress{height:8px;background:#000;border-radius:10px;overflow:hidden;margin-top:12px;display:none}
.progress-bar{height:100%;background:var(--gradient);width:0%;transition:width 0.2s}
.btn{background:var(--gradient);color:#000;border:none;padding:14px;border-radius:12px;font-weight:900;width:100%;cursor:pointer}
.btn:disabled{opacity:0.5}
.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-100px);background:var(--accent);color:#000;padding:12px 20px;border-radius:20px;font-weight:800;z-index:999;transition:0.3s;opacity:0}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.error{background:var(--danger);color:#fff}
.ai-row{display:flex;align-items:center;justify-content:space-between;padding:12px;background:#000;border:1px solid var(--border);border-radius:12px;margin-bottom:12px}
.toggle{width:44px;height:26px;background:#222;border-radius:20px;position:relative;cursor:pointer}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:3px;left:3px;transition:0.2s}
.toggle.on::after{left:21px}
</style>
</head>
<body>
<header><svg onclick="location.href='index.html'" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><h2>Create</h2></header>
<div id="toast" class="toast"></div>
<div class="content">
<div class="type-grid">
<div class="type-btn active" data-ui="reel" onclick="setType('reel')">Reel</div>
<div class="type-btn" data-ui="photo" onclick="setType('photo')">Photo</div>
<div class="type-btn" data-ui="shortstory" onclick="setType('shortstory')">Story</div>
</div>
<div class="card">
<div class="drop" id="drop" onclick="if(!isUploading) document.getElementById('file-input').click()">
<div class="drop-placeholder" id="placeholder"><b>Tap to select file</b><p style="font-size:12px;color:#888" id="tip-text">MP4 - Max 180s - Max 17MB</p></div>
<img id="img-preview" style="display:none">
<canvas id="thumb-canvas" style="display:none"></canvas>
<div class="file-info" id="file-info"><p id="file-name" style="font-size:12px"></p><p id="file-meta" style="font-size:11px;color:#aaa"></p></div>
<input type="file" id="file-input" style="display:none">
</div>
<div class="progress" id="progress-wrap"><div class="progress-bar" id="progress"></div></div>
<p id="progress-text" style="font-size:12px;text-align:center;margin-top:6px;display:none"></p>
<p id="network-text" style="font-size:11px;text-align:center;color:#888;margin-top:4px;display:none"></p>
</div>
<div class="card"><input class="input" id="title" placeholder="Title"><textarea class="input" id="caption" placeholder="Caption" rows="4"></textarea>
<div class="ai-row"><div><b style="font-size:13px">AI content</b><p style="font-size:11px;color:#888">Toggle adds #AI tag</p></div><div class="toggle" id="ai-toggle" onclick="toggleAI()"></div></div>
<button class="btn" id="publish-btn" onclick="submitPost()">Post</button></div>
</div>
<script>
const API='https://golviral-api.onrender.com';
const CDN_API='https://golviral-cdn.onrender.com';
const CDN_KEY='sk_live_golviral_cdn_replace_this_with_32_random_chars';
const TOKEN=localStorage.token;
if(!TOKEN) location.href='auth.html';

let uiType='reel', selectedFile=null, isUploading=false, isAIToggled=false;
let currentObjectUrl=null;

function parseJwt(token) {
  try {
    const base64Url = token.split('.')[1];
    if (!base64Url) return null;
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    const jsonPayload = decodeURIComponent(
      atob(base64)
        .split('')
        .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
        .join('')
    );
    const parsed = JSON.parse(jsonPayload);
    return parsed.userId || parsed.id || parsed._id || parsed.sub || '';
  } catch (e) {
    return '';
  }
}

function toast(m,e=false){const t=document.getElementById('toast');t.innerText=m;t.className='toast '+(e?'error':'');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500)}

function toggleAI(){
  isAIToggled=!isAIToggled;
  document.getElementById('ai-toggle').classList.toggle('on',isAIToggled);
  const capInput=document.getElementById('caption');
  let text=capInput.value;

  if(isAIToggled){
    if(!/#AI\b/i.test(text)){
      text = text.trim()? text.trim() + ' #AI' : '#AI';
      capInput.value = text;
    }
    toast('AI tag added #AI');
  } else {
    capInput.value = text.replace(/\s*#AI\b/gi,'').replace(/\s{2,}/g,' ').trim();
    toast('AI tag removed');
  }
}

function safeRevoke(){if(currentObjectUrl){try{URL.revokeObjectURL(currentObjectUrl)}catch{} currentObjectUrl=null}}

function setType(type){
  if(isUploading) return;
  uiType=type; safeRevoke(); selectedFile=null;
  document.getElementById('file-input').value='';
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`[data-ui="${type}"]`).classList.add('active');
  const drop=document.getElementById('drop');
  const fileInput=document.getElementById('file-input');
  document.getElementById('img-preview').style.display='none';
  document.getElementById('thumb-canvas').style.display='none';
  document.getElementById('file-info').style.display='none';
  document.getElementById('placeholder').style.display='flex';
  document.getElementById('progress-wrap').style.display='none';
  document.getElementById('progress-text').style.display='none';
  if(type==='shortstory'){drop.style.display='none';}
  else{
    drop.style.display='flex';
    fileInput.accept= type==='reel'? 'video/mp4,video/quicktime,video/*' : 'image/jpeg,image/png,image/webp,image/*';
    document.getElementById('tip-text').innerText= type==='reel'? 'MP4 - Max 180s - Max 17MB' : 'JPG/PNG - Max 17MB';
  }
}

function createVideoThumb(file){
  return new Promise((resolve)=>{
    const url = URL.createObjectURL(file);
    const video = document.createElement('video');
    video.muted=true; video.playsInline=true; video.preload='metadata';
    video.src=url;
    let done=false;
    const finish=(obj)=>{ if(done) return; done=true; try{URL.revokeObjectURL(url)}catch{} try{video.remove()}catch{} resolve(obj); };
    video.onloadedmetadata=()=>{ if(video.duration>180){ finish({error:'Video too long! Max 3 min'}); return; } try{video.currentTime=0.5}catch{finish({duration:0})} };
    video.onseeked=()=>{
      try{
        const canvas=document.getElementById('thumb-canvas');
        const w=320, h= Math.round(w * video.videoHeight / video.videoWidth) || 500;
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(video,0,0,w,h);
        canvas.style.display='block';
      }catch{}
      finish({duration:video.duration||0});
    };
    video.onerror=()=> finish({duration:0});
    setTimeout(()=> finish({duration:video.duration||0}), 4000);
  });
}

document.getElementById('file-input').onchange=async e=>{
  selectedFile=e.target.files[0];
  if(!selectedFile) return;
  if(selectedFile.size>17*1024*1024){toast('File too big! Max 17MB',true);selectedFile=null;e.target.value='';return;}
  document.getElementById('placeholder').style.display='none';
  const info=document.getElementById('file-info');
  if(uiType==='photo'){
    safeRevoke(); currentObjectUrl=URL.createObjectURL(selectedFile);
    const img=document.getElementById('img-preview');
    img.src=currentObjectUrl; img.style.display='block';
    document.getElementById('thumb-canvas').style.display='none';
    info.style.display='block'; document.getElementById('file-name').innerText=selectedFile.name;
    document.getElementById('file-meta').innerText=(selectedFile.size/1024/1024).toFixed(1)+' MB • Tap to change';
  } else {
    document.getElementById('img-preview').style.display='none';
    info.style.display='block'; document.getElementById('file-name').innerText=selectedFile.name;
    document.getElementById('file-meta').innerText='Generating preview...';
    const result=await createVideoThumb(selectedFile);
    if(result.error){toast(result.error,true);selectedFile=null;e.target.value='';document.getElementById('placeholder').style.display='flex';info.style.display='none';document.getElementById('thumb-canvas').style.display='none';return;}
    document.getElementById('file-meta').innerText=(selectedFile.size/1024/1024).toFixed(1)+' MB • '+Math.round(result.duration||0)+'s • Tap to change';
  }
};

function uploadWithRetry(formData, attempt=1){
  return new Promise((resolve,reject)=>{
    if(!navigator.onLine){ reject(new Error('You are offline')); return; }
    const xhr=new XMLHttpRequest();
    xhr.open('POST', CDN_API+'/api/cdn/upload-direct');
    xhr.timeout=600000;
    xhr.setRequestHeader('x-api-key', CDN_KEY);
    let lastLoaded=0, lastTime=Date.now();
    xhr.upload.onprogress=e=>{
      if(!e.lengthComputable) return;
      const percent=(e.loaded/e.total*100);
      document.getElementById('progress-wrap').style.display='block';
      document.getElementById('progress').style.width=percent+'%';
      const now=Date.now();
      const speed = (e.loaded-lastLoaded)/((now-lastTime)/1000+0.001);
      lastLoaded=e.loaded; lastTime=now;
      const mbLeft=((e.total-e.loaded)/1024/1024).toFixed(1);
      const speedText=speed>1024*1024? (speed/1024/1024).toFixed(1)+' MB/s' : (speed/1024).toFixed(0)+' KB/s';
      document.getElementById('progress-text').style.display='block';
      document.getElementById('progress-text').innerText=`${percent.toFixed(0)}% • ${mbLeft} MB left`;
      document.getElementById('network-text').style.display='block';
      document.getElementById('network-text').innerText=`${speedText} • Attempt ${attempt}/3`;
    };
    xhr.onload=()=>{
      if(xhr.status>=200&&xhr.status<300){
        try{ resolve(JSON.parse(xhr.responseText)); }catch{ resolve({ok:true}); }
      } else {
        if(attempt<3){ setTimeout(()=>{ uploadWithRetry(formData, attempt+1).then(resolve).catch(reject); }, attempt*1500); }
        else reject(new Error('Upload failed: '+xhr.status));
      }
    };
    xhr.onerror=()=>{
      if(attempt<3){ toast(`Network glitch, retrying ${attempt}/3...`); setTimeout(()=>{ uploadWithRetry(formData, attempt+1).then(resolve).catch(reject); }, attempt*2000); }
      else reject(new Error('Network error - check data'));
    };
    xhr.ontimeout=()=>{
      if(attempt<3){ toast(`Slow network, retrying...`); uploadWithRetry(formData, attempt+1).then(resolve).catch(reject); }
      else reject(new Error('Timeout - try smaller file'));
    };
    xhr.send(formData);
  });
}

async function submitPost(){
  if(uiType!=='shortstory'&&!selectedFile) return toast('Select a file',true);
  if(isUploading) return;
  if(!navigator.onLine) return toast('You are offline',true);

  const userId = parseJwt(TOKEN);
  if(!userId) return toast('Session error - please re-login', true);

  isUploading=true;
  const btn=document.getElementById('publish-btn');
  btn.disabled=true; btn.innerText='Posting...';
  document.getElementById('progress-wrap').style.display='block';
  document.getElementById('progress').style.width='2%';
  try{
    const title=document.getElementById('title').value.trim();
    let caption=document.getElementById('caption').value.trim();
    if(isAIToggled){
      if(!/#AI\b/i.test(caption)) caption = caption? caption + ' #AI' : '#AI';
    } else {
      caption = caption.replace(/\s*#AI\b/gi,'').trim();
    }
    btn.innerText='Creating post...';
    const intentRes=await fetch(API+'/api/post/create-intent',{
      method:'POST',
      headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'},
      body:JSON.stringify({postType: uiType==='reel'?'reel':uiType==='photo'?'store':'novel', contentType:selectedFile?.type||'text', fileExtension:selectedFile?.name.split('.').pop()||'txt', caption, title, isAI:isAIToggled})
    });
    const intent=await intentRes.json();
    if(intent.error) throw new Error(intent.error);
    if(uiType!=='shortstory'){
      btn.innerText='Uploading...';
      const form=new FormData();
      form.append('video',selectedFile);
      form.append('userId',userId);
      form.append('postId',intent.postId);
      form.append('title',title);
      form.append('caption',caption);
      await uploadWithRetry(form,1);
    }
    safeRevoke();
    document.getElementById('progress').style.width='100%';
    toast('Posted!');
    setTimeout(()=>location.href='index.html',800);
  }catch(err){
    toast(err.message,true);
    btn.disabled=false; btn.innerText='Post'; isUploading=false;
    document.getElementById('network-text').innerText='Failed - tap Post to retry';
  }
}

window.addEventListener('offline',()=>{ if(isUploading) toast('You went offline',true); });
window.addEventListener('online',()=>{ if(isUploading) toast('Back online - retrying...'); });

document.getElementById('caption').addEventListener('input', (e)=>{
  const hasTag = /#AI\b/i.test(e.target.value);
  if(!hasTag && isAIToggled){
    isAIToggled=false;
    document.getElementById('ai-toggle').classList.remove('on');
  }
  if(hasTag &&!isAIToggled){
    isAIToggled=true;
    document.getElementById('ai-toggle').classList.add('on');
  }
});
</script>
</body>
</html>
