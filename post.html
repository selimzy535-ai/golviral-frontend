<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GolViral - Create</title>
<style>
:root{--bg:#050505;--card:#0f0f0f;--glass:rgba(15,15,15,0.65);--accent:#00ff88;--text:#fff;--muted:#888;--border:#1f1f1f;--danger:#ff4444;--gradient:linear-gradient(135deg,#00ff88,#3b82f6)}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:var(--bg);color:var(--text);max-width:500px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
header{padding:16px;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.content{flex:1;overflow-y:auto;padding:20px}
h2{margin-bottom:16px}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.type-btn{border:1px solid var(--border);background:var(--card);border-radius:14px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:12px}
.type-btn.active{border-color:var(--accent);background:rgba(0,255,136,0.1)}
.type-btn svg{stroke:var(--accent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;margin-bottom:12px;overflow:hidden}
.input{width:100%;background:#000;border:1px solid var(--border);color:var(--text);padding:14px;border-radius:12px;margin-bottom:12px;outline:none}
.input:focus{border-color:var(--accent)}
.drop{border:2px dashed var(--border);border-radius:12px;padding:0;text-align:center;margin-bottom:12px;cursor:pointer;position:relative;height:420px;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;background:#000}
.drop img,.drop video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;border-radius:12px;z-index:3}
.drop-placeholder{pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:1}
.progress{height:8px;background:#000;border-radius:10px;overflow:hidden;margin-top:12px;display:none}
.progress-bar{height:100%;background:var(--gradient);width:0%;transition:0.2s}
.progress-text{font-size:12px;color:var(--muted);text-align:center;margin-top:6px;display:none}
.btn{background:var(--gradient);color:#000;border:none;padding:14px;border-radius:12px;font-weight:900;width:100%;cursor:pointer}
.btn:disabled{opacity:0.6}
.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-100px);background:var(--accent);color:#000;padding:12px 20px;border-radius:20px;font-weight:800;z-index:999;transition:0.3s;opacity:0}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.error{background:var(--danger);color:#fff}
.tip{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}

/* FB + IG EFFECT UI */
.cam-wrap{position:relative;width:100%;height:420px;background:#000;border-radius:12px;overflow:hidden}
.cam-wrap video,.cam-wrap canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.effect-side{position:absolute;right:10px;top:20px;z-index:5;display:flex;flex-direction:column;gap:12px}
.effect-btn{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,0.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.15);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:10px;gap:2px;cursor:pointer}
.effect-btn.active{background:#fff;color:#000}
.effect-bottom{position:absolute;bottom:18px;left:0;right:0;z-index:5;display:flex;gap:12px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.effect-circle{width:62px;height:62px;border-radius:50%;border:3px solid transparent;overflow:hidden;flex-shrink:0;background:#222}
.effect-circle.active{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,0.25)}
.effect-circle img{width:100%;height:100%;object-fit:cover}
.record-bar{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:16px}
.rec-btn{width:76px;height:76px;border-radius:50%;background:transparent;border:4px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.rec-btn-inner{width:56px;height:56px;border-radius:50%;background:#ff2a2a;transition:0.2s}
.rec-btn.recording.rec-btn-inner{width:32px;height:32px;border-radius:8px;background:#ff0000;animation:pulse 1s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:0.6}100%{opacity:1}}
.fb-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 2px}
.fb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#000;border-radius:12px;overflow:hidden}
.fb-grid-item{aspect-ratio:1/1;background:#111;position:relative;overflow:hidden;cursor:pointer}
.fb-grid-item img,.fb-grid-item video{width:100%;height:100%;object-fit:cover}
.fb-grid-item.active::after{content:'';position:absolute;inset:0;border:3px solid var(--accent);pointer-events:none}
.ai-row{display:flex;align-items:center;justify-content:space-between;padding:12px;background:#000;border:1px solid var(--border);border-radius:12px;margin-bottom:12px}
.toggle{width:44px;height:26px;background:#222;border-radius:20px;position:relative;cursor:pointer;transition:0.2s}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:3px;left:3px;transition:0.2s}
.toggle.on::after{left:21px}
</style>
</head>
<body>
<header><svg onclick="location.href='index.html'" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><h2>Create</h2></header>
<div id="toast" class="toast"></div>
<div class="content">
<div class="type-grid">
<div class="type-btn active" data-ui="reel" onclick="setType('reel')"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>Reel</div>
<div class="type-btn" data-ui="photo" onclick="setType('photo')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>Photo</div>
<div class="type-btn" data-ui="shortstory" onclick="setType('shortstory')"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M4 4h16v13H4z"></path></svg>Short Story</div>
</div>

<div class="card" id="camera-card">
<div class="cam-wrap" id="cam-wrap">
<video id="cam" autoplay muted playsinline style="display:none"></video>
<canvas id="cam-canvas" style="display:none"></canvas>
<video id="video-preview" style="display:none" playsinline loop></video>
<img id="img-preview" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;border-radius:12px;z-index:3">
<div class="drop-placeholder" id="placeholder" style="position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;flex-direction:column"><svg width="40" height="40" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M17 8l-5-5-5 5"></path><path d="M12 3v12"></path></svg><b>Camera off - Tap to open gallery</b><p class="tip" id="tip-text">MP4 or MOV • Max 180s • Max 17MB</p></div>

<div class="effect-side" id="effect-side">
<div class="effect-btn" onclick="document.getElementById('file-input').click()">📁<span>Gallery</span></div>
<div class="effect-btn" onclick="switchCamera()">🔄<span>Flip</span></div>
<div class="effect-btn active" id="btn-effects">✨<span>Effects</span></div>
</div>

<div class="record-bar" id="record-bar">
<div class="rec-btn" id="rec-btn" onclick="toggleRecord()"><div class="rec-btn-inner"></div></div>
</div>
<div class="effect-bottom" id="effect-bottom"></div>
</div>

<div class="fb-bar"><b id="fb-label">Camera roll</b><button style="background:#1f1f1f;border:1px solid var(--border);color:#fff;padding:6px 12px;border-radius:20px;font-size:12px" onclick="document.getElementById('file-input').click()">Select multiple</button></div>
<div class="fb-grid" id="fb-grid"></div>
<input type="file" id="file-input" style="display:none" multiple>
<div class="progress" id="progress-wrap"><div class="progress-bar" id="progress"></div></div>
<div class="progress-text" id="progress-text"></div>
<p id="upload-warn" style="display:none;font-size:11px;color:var(--danger);text-align:center;margin-top:6px">⚠️ Don't close this tab while uploading...</p>
</div>

<div class="card" id="details-step">
<input class="input" id="title" placeholder="Title">
<textarea class="input" id="caption" placeholder="Caption / Story text" rows="4"></textarea>
<div class="ai-row">
<div><b style="font-size:13px">This is AI content</b><p style="font-size:11px;color:var(--muted)">Turn on if AI generated</p></div>
<div class="toggle" id="ai-toggle" onclick="toggleAI()"></div>
</div>
<button class="btn" id="publish-btn" onclick="submitPost()">Post</button>
</div>
</div>
<script>
const API='https://golviral-api.onrender.com';
const CDN_API='https://golviral-cdn.onrender.com';
const CDN_KEY='sk_live_golviral_cdn_replace_this_with_32_random_chars';
const TOKEN=localStorage.token;
if(!TOKEN) location.href='auth.html';
function parseJwt(t){try{return JSON.parse(atob(t.split('.')[1]))}catch{location.href='auth.html'}}
const TYPE_MAP={reel:'reel',photo:'store',shortstory:'novel'};
let uiType='reel';let selectedFile=null;let isUploading=false;let isAIToggled=false;
let stream=null;let mediaRecorder=null;let recordedChunks=[];let facing='user';let recordingTimer=null;

const EFFECTS=[
{id:'none',name:'Normal',filter:'none',css:'none'},
{id:'candy',name:'candy',filter:'contrast(0.9) sepia(0.2) hue-rotate(-10deg) saturate(1.3)',css:'contrast(0.9) sepia(0.2) hue-rotate(-10deg) saturate(1.3)'},
{id:'gray',name:'B&W',filter:'grayscale(1) contrast(1.1)',css:'grayscale(1) contrast(1.1)'},
{id:'vintage',name:'Vintage',filter:'sepia(0.6) contrast(1.2)',css:'sepia(0.6) contrast(1.2)'},
{id:'vivid',name:'Vivid',filter:'saturate(1.8) contrast(1.2)',css:'saturate(1.8) contrast(1.2)'},
{id:'blur',name:'Dream',filter:'blur(1px) brightness(1.1) saturate(1.2)',css:'blur(1px) brightness(1.1)'},
];
let currentFilter=EFFECTS[1];

function toast(m,e=false){const t=document.getElementById('toast');t.innerText=m;t.className='toast '+(e?'error':'');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}

function renderEffects(){
 const bar=document.getElementById('effect-bottom');
 bar.innerHTML=EFFECTS.map(e=>`<div class="effect-circle ${e.id===currentFilter.id?'active':''}" onclick="applyEffect('${e.id}')"><img src="https://picsum.photos/seed/${e.id}/100" style="filter:${e.css}"></div>`).join('');
}
function applyEffect(id){
 currentFilter=EFFECTS.find(x=>x.id===id);
 document.getElementById('cam').style.filter=currentFilter.css;
 document.getElementById('img-preview').style.filter=currentFilter.css;
 document.getElementById('video-preview').style.filter=currentFilter.css;
 document.getElementById('cam-canvas').style.filter=currentFilter.css;
 renderEffects();
}

function toggleAI(){
 isAIToggled=!isAIToggled;
 document.getElementById('ai-toggle').classList.toggle('on',isAIToggled);
 const cap=document.getElementById('caption');
 if(isAIToggled){
   if(!cap.value.includes('#AI')) cap.value = (cap.value.trim() + ' #AI').trim();
 }else{
   cap.value = cap.value.replace(/#AI/g,'').replace(/\s+/g,' ').trim();
 }
}

async function startCamera(){
 try{
   if(stream) stream.getTracks().forEach(t=>t.stop());
   stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing, width:{ideal:720}, height:{ideal:1280}}, audio:true});
   const cam=document.getElementById('cam');
   cam.srcObject=stream; cam.style.display='block';
   document.getElementById('placeholder').style.display='none';
   document.getElementById('img-preview').style.display='none';
   document.getElementById('video-preview').style.display='none';
   applyEffect(currentFilter.id);
 }catch(e){ toast('Camera blocked, use gallery',true); }
}
function switchCamera(){ facing=facing==='user'?'environment':'user'; startCamera(); }

function setType(type){
 uiType=type;
 document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
 document.querySelector(`[data-ui="${type}"]`).classList.add('active');
 const camCard=document.getElementById('camera-card');
 if(type==='shortstory'){ camCard.style.display='none'; selectedFile=null; if(stream){stream.getTracks().forEach(t=>t.stop());} }
 else{
   camCard.style.display='block';
   const fileInput=document.getElementById('file-input');
   if(type==='reel'){fileInput.accept='video/*'; document.getElementById('tip-text').innerText='MP4 or MOV • Max 180s • Max 17MB'; document.getElementById('rec-btn').style.display='flex'; }
   if(type==='photo'){fileInput.accept='image/*'; document.getElementById('tip-text').innerText='JPG, PNG, WEBP • Max 17MB'; document.getElementById('rec-btn').style.display='none'; }
   if(type==='reel' &&!selectedFile) startCamera();
 }
}

let allFiles=[];
document.getElementById('file-input').onchange=e=>{
 allFiles=[...e.target.files];
 const grid=document.getElementById('fb-grid'); grid.innerHTML='';
 if(!allFiles.length) return;
 allFiles.forEach((file,idx)=>{
   const url=URL.createObjectURL(file);
   const div=document.createElement('div'); div.className='fb-grid-item';
   div.innerHTML=file.type.startsWith('video')?`<video src="${url}" muted></video>`:`<img src="${url}">`;
   div.onclick=()=>{document.querySelectorAll('.fb-grid-item').forEach(i=>i.classList.remove('active')); div.classList.add('active'); selectFile(file);};
   grid.appendChild(div);
   if(idx===0){div.classList.add('active'); selectFile(file);}
 });
};

function selectFile(file){
 selectedFile=file;
 if(file.size>17*1024*1024){toast('File too big! Max 17MB',true);return;}
 if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;}
 document.getElementById('cam').style.display='none';
 document.getElementById('placeholder').style.display='none';
 if(file.type.startsWith('image')){
   const img=document.getElementById('img-preview'); img.src=URL.createObjectURL(file); img.style.display='block';
   document.getElementById('video-preview').style.display='none';
 }else{
   const vp=document.getElementById('video-preview'); vp.src=URL.createObjectURL(file); vp.style.display='block'; vp.controls=true; vp.muted=false; vp.play().catch(()=>{});
   document.getElementById('img-preview').style.display='none';
   vp.onloadedmetadata=()=>{ if(vp.duration>180){toast('Video too long! Max 3 min',true); selectedFile=null;} };
 }
 applyEffect(currentFilter.id);
}

function toggleRecord(){
 const btn=document.getElementById('rec-btn');
 if(mediaRecorder && mediaRecorder.state==='recording'){ stopRecord(); return; }
 recordedChunks=[];
 // record canvas with filter applied
 const canvas=document.getElementById('cam-canvas'); const cam=document.getElementById('cam');
 canvas.width=720; canvas.height=1280; canvas.style.display='block';
 const ctx=canvas.getContext('2d');
 const draw=()=>{ if(cam.srcObject){ ctx.filter=currentFilter.css; ctx.drawImage(cam,0,0,canvas.width,canvas.height); } if(mediaRecorder && mediaRecorder.state==='recording') requestAnimationFrame(draw); };
 draw();
 const canvasStream=canvas.captureStream(30);
 // add audio
 const audioTrack=stream.getAudioTracks()[0];
 if(audioTrack) canvasStream.addTrack(audioTrack);
 mediaRecorder=new MediaRecorder(canvasStream,{mimeType:'video/webm'});
 mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) recordedChunks.push(e.data); };
 mediaRecorder.onstop=()=>{
   const blob=new Blob(recordedChunks,{type:'video/webm'});
   const file=new File([blob],`reel-${Date.now()}.webm`,{type:'video/webm'});
   selectFile(file);
   canvas.style.display='none';
   btn.classList.remove('recording');
   clearTimeout(recordingTimer);
   toast('10s clip ready!');
 };
 mediaRecorder.start();
 btn.classList.add('recording');
 toast('Recording 10s...');
 // auto stop at 10s like IG
 recordingTimer=setTimeout(()=>{ if(mediaRecorder.state==='recording') stopRecord(); },10000);
}
function stopRecord(){ if(mediaRecorder) mediaRecorder.stop(); }

function uploadFileWithProgress(url,formData){
 return new Promise((res,rej)=>{
   const xhr=new XMLHttpRequest(); xhr.open('POST',url); xhr.setRequestHeader('x-api-key',CDN_KEY);
   xhr.upload.onprogress=e=>{
     if(e.lengthComputable){
       let p=(e.loaded/e.total*100).toFixed(0);
       document.getElementById('progress-wrap').style.display='block';
       document.getElementById('progress').style.width=p+'%';
       document.getElementById('progress-text').style.display='block';
       document.getElementById('progress-text').innerText=`Posting... ${p}%`;
       document.getElementById('upload-warn').style.display='block';
     }
   };
   xhr.onload=()=>{ if(xhr.status>=200&&xhr.status<300) res(JSON.parse(xhr.responseText)); else rej(new Error('Post failed')); };
   xhr.onerror=()=>rej(new Error('Network error')); xhr.send(formData);
 });
}

async function submitPost(){
 if(uiType!=='shortstory'&&!selectedFile) return toast('Select or record a file',true);
 if(isUploading) return;
 const btn=document.getElementById('publish-btn'); isUploading=true; btn.disabled=true; btn.innerText='Posting...';
 const title=document.getElementById('title').value;
 let caption=document.getElementById('caption').value;
 if(isAIToggled &&!caption.includes('#AI')) caption= (caption+' #AI').trim();
 const backendType=TYPE_MAP[uiType];
 const d=parseJwt(TOKEN); const userId=d.userId||d.id;
 try{
   const intentRes=await fetch(API+'/api/post/create-intent',{method:'POST',headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({postType:backendType,contentType:selectedFile?selectedFile.type:null,fileExtension:selectedFile?selectedFile.name.split('.').pop():null,caption,title,filter:currentFilter.id,isAI:isAIToggled})});
   const intent=await intentRes.json(); if(intent.error) throw new Error(intent.error);
   if(uiType!=='shortstory'){
     const form=new FormData(); form.append('video',selectedFile); form.append('userId',userId); form.append('postId',intent.postId); form.append('title',title); form.append('caption',caption); form.append('filter',currentFilter.id);
     await uploadFileWithProgress(CDN_API+'/api/cdn/upload-direct',form);
   }
   toast('Posted 🎉'); location.href='index.html';
 }catch(err){ toast(err.message,true); btn.disabled=false; btn.innerText='Post'; isUploading=false; document.getElementById('progress-wrap').style.display='none'; document.getElementById('upload-warn').style.display='none'; }
}
renderEffects();
setType('reel');
</script>
</body>
</html>
