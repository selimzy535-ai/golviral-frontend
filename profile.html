<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GolViral - Profile</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#000;--card:#0a0a0a;--glass:rgba(10,10,10,0.6);--text:#fff;--muted:#888;--border:#1a1a1a;
  --green:#00ff88;--purple:#a855f7;--blue:#3b82f6;
  --gradient:linear-gradient(135deg,#00ff88,#3b82f6,#a855f7)
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);max-width:500px;margin:0 auto;min-height:100dvh;padding-bottom:80px}
header{padding:16px;display:flex;justify-content:space-between;align-items:center;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;cursor:pointer}
.cover{height:180px;background:var(--gradient);position:relative}
.avatar-wrap{position:absolute;bottom:-50px;left:20px;display:flex;align-items:end;gap:12px}
.avatar{width:100px;height:100px;border-radius:50%;background:var(--gradient);padding:4px;border:4px solid var(--bg)}
.avatar img{width:100%;height:100%;border-radius:50%;background:var(--card);object-fit:cover}
.profile-info{padding:60px 20px 20px 20px}
.name-row{display:flex;justify-content:space-between;align-items:start}
.name-row h2{font-size:22px;font-weight:900}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:800;margin-top:4px;margin-right:4px}
.badge.verified{background:var(--blue);color:#fff}
.badge.creator{background:var(--purple);color:#fff}
.bio{color:var(--muted);font-size:14px;margin:8px 0}
.stats-row{display:flex;gap:20px;margin:12px 0;font-size:15px}
.stats-row b{font-weight:900}
.btn-row{display:flex;gap:8px;margin:16px 0}
.btn{flex:1;background:var(--gradient);color:#000;border:none;padding:10px;border-radius:10px;font-weight:900;cursor:pointer;font-size:15px}
.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.tabs{display:flex;gap:0;padding:0 0;border-bottom:1px solid var(--border);position:sticky;top:57px;background:var(--bg);z-index:10}
.tab{flex:1;text-align:center;padding:14px;color:var(--muted);cursor:pointer;font-weight:700;border-bottom:3px solid transparent}
.tab.active{color:var(--green);border-color:var(--green)}
.content{padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px}
.grid-item{aspect-ratio:1;background:var(--card);background-size:cover;background-position:center}
.card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:12px;margin-bottom:10px;outline:none}
.btn-full{background:var(--gradient);color:#000;border:none;padding:12px;border-radius:12px;font-weight:900;width:100%;cursor:pointer;font-size:16px}
.dropdown{position:absolute;right:20px;top:240px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 0;display:none;z-index:30;min-width:180px}
.dropdown.active{display:block}
.dropdown-item{padding:10px 16px;cursor:pointer;font-size:14px}
.dropdown-item:hover{background:var(--glass)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);display:none;justify-content:center;align-items:center;z-index:200}
.modal.active{display:flex}
.glass-modal{background:var(--glass);border:1px solid var(--border);border-radius:20px;padding:24px;width:90%;max-width:400px}
.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-100px);background:var(--green);color:#000;padding:12px 20px;border-radius:20px;font-weight:800;z-index:999;transition:0.3s;opacity:0}
.toast.show{transform:translate(-50%,0);opacity:1}
.copy-box{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);padding:10px;border-radius:12px;margin-top:8px;font-size:12px;word-break:break-all}
</style>
</head>
<body>
<header>
<svg onclick="location.href='index.html'" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
<b>GolViral</b>
<svg onclick="toggleMenu()" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
</header>

<div id="toast" class="toast"></div>

<!-- COVER + AVATAR -->
<div class="cover">
  <div class="avatar-wrap">
    <div class="avatar"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300ff88'%3E%3Cpath d='M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'/%3E%3Ccircle cx='12' cy='7' r='4'/%3E%3C/svg%3E"></div>
  </div>
</div>

<!-- 3 DOT MENU -->
<div id="menu" class="dropdown">
  <div class="dropdown-item" onclick="copyLink('profile-link')">Copy Profile Link</div>
  <div class="dropdown-item" onclick="copyLink('referral-link')">Copy Referral Link</div>
  <div class="dropdown-item" onclick="showTab('wallet', document.querySelector('.tab:nth-child(2)'))">Wallet</div>
  <div class="dropdown-item" onclick="logout()">Logout</div>
</div>

<div class="profile-info">
  <div class="name-row">
    <div>
      <h2 id="username-display"></h2>
      <p id="joined-date" style="color:var(--muted);font-size:12px"></p>
      <div id="badges"></div>
    </div>
  </div>
  
  <div class="stats-row">
    <div><b id="posts">0</b> Posts</div>
    <div><b id="followers">0</b> Followers</div>
    <div><b id="following">0</b> Following</div>
  </div>

  <div class="btn-row">
    <button id="follow-btn" class="btn" onclick="toggleFollow()">Follow</button>
    <button class="btn secondary" onclick="showTab('wallet', document.querySelector('.tab:nth-child(2)'))">Wallet</button>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
<div class="tab active" onclick="showTab('posts',this)">Posts</div>
<div class="tab" onclick="showTab('wallet',this)">Wallet</div>
<div class="tab" onclick="showTab('gifts',this)">Gifts</div>
<div class="tab" onclick="showTab('support',this)">Support</div>
</div>

<div class="content">
<div id="tab-posts"></div>
<div id="tab-wallet" style="display:none"></div>
<div id="tab-gifts" style="display:none"></div>
<div id="tab-support" style="display:none"></div>
</div>

<!-- HIDDEN LINKS FOR COPY -->
<span id="profile-link" style="display:none"></span>
<span id="referral-link" style="display:none"></span>

<div id="otp-modal" class="modal"><div class="glass-modal">
<h3 style="margin-bottom:12px">Verify Withdrawal</h3>
<input class="input" id="otp-input" placeholder="123456">
<button class="btn-full" onclick="confirmWithdraw()">Confirm</button>
</div></div>

<script>
const API='https://golviral-api.onrender.com';
const TOKEN=localStorage.token;
if(!TOKEN) location.href='auth.html';
const profileId=new URLSearchParams(location.search).get('id')||localStorage.userId;
const isSelf=profileId===localStorage.userId;
let pendingWithdraw=null;

function toast(msg){const t=document.getElementById('toast');t.innerText=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
async function api(path,opt={}){try{const res=await fetch(API+path,{...opt,headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json',...opt.headers}});if(res.status===401)location.href='auth.html';return res.json()}catch{toast('Network error');return {}}}

function toggleMenu(){document.getElementById('menu').classList.toggle('active')}
document.addEventListener('click',e=>{if(!e.target.closest('#menu')&&!e.target.closest('header svg:last-child'))document.getElementById('menu').classList.remove('active')})

async function loadProfile(){
const u=await api(`/api/user/${profileId}`);
document.getElementById('username-display').innerText=u.username;
document.getElementById('posts').innerText=u.totalPosts||0;
document.getElementById('followers').innerText=u.followers||0;
document.getElementById('following').innerText=u.following||0;
document.getElementById('joined-date').innerText = `Joined ${new Date(u.createdAt).toLocaleDateString('en-US',{month:'short', year:'numeric'})}`;

let badges='';
if(u.isVerified) badges+=`<span class="badge verified">Verified</span>`;
if(u.dmUnlocked) badges+=`<span class="badge creator">Creator</span>`;
document.getElementById('badges').innerHTML=badges;

document.getElementById('profile-link').innerText=u.profileLink;
document.getElementById('referral-link').innerText=u.referralLink;

if(!isSelf){
  document.getElementById('follow-btn').innerText=u.isFollowing?'Following':'Follow';
  document.getElementById('follow-btn').className = u.isFollowing?'btn secondary':'btn';
}else{
  document.getElementById('follow-btn').style.display='none';
}
loadPosts();
}

function copyLink(id){
  navigator.clipboard.writeText(document.getElementById(id).innerText);
  toast('Copied');toggleMenu();
}

async function loadPosts(){
const d=await api(`/api/user/${profileId}/posts`);
document.getElementById('tab-posts').innerHTML=`<div class="grid">${(d||[]).map(p=>`<div class="grid-item" style="background-image:url(/api/media/sign?key=${p.mediaUrl}&shard=${p.b2Shard})"></div>`).join('')}</div>`;
}

function showTab(tab,el){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
document.querySelectorAll('[id^=tab-]').forEach(d=>d.style.display='none');
document.getElementById('tab-'+tab).style.display='block';
if(tab==='wallet')loadWallet();
if(tab==='gifts')loadGifts();
if(tab==='support')loadSupport();
}

// WALLET / GIFTS / SUPPORT CODE SAME AS YOURS - just pasted below
async function loadWallet(){
const w=await api('/api/wallet');
document.getElementById('tab-wallet').innerHTML=`
<div class="card"><b>Status: ${w.monetized? '✅ Monetized' : '❌ Not Monetized'}</b><br>Free: ${w.freeCredits} | Cash: ₦${w.cashBalance}</div>
<div class="card"><button class="btn-full" onclick="deposit(1500)">Deposit ₦1500</button><button class="btn-full" style="margin-top:8px" onclick="deposit(7000)">Deposit ₦7000</button></div>
<div class="card"><input class="input" id="withdraw-amount" type="number" placeholder="Withdraw Points"><button class="btn-full" onclick="requestWithdraw()">Request</button></div>`;
}
async function deposit(amount){const d=await api('/api/deposit/init',{method:'POST',body:JSON.stringify({tierAmount:amount})});if(d.selarLink)window.open(d.selarLink)}
async function requestWithdraw(){const amount=document.getElementById('withdraw-amount').value;const res=await api('/api/wallet/withdraw',{method:'POST',body:JSON.stringify({amountPoints:Number(amount),method:'BANK',targetDetails:{}})});if(res.authChallenge)document.getElementById('otp-modal').classList.add('active')}
async function confirmWithdraw(){const otpVal=document.getElementById('otp-input').value;await api('/api/wallet/withdraw/confirm',{method:'POST',body:JSON.stringify({otp:otpVal})});document.getElementById('otp-modal').classList.remove('active');toast('Requested')}

function loadGifts(){document.getElementById('tab-gifts').innerHTML=`<div class="card" onclick="buyGift('RUBY')"><b>RUBY</b><p>₦5000</p></div>`}
async function buyGift(type){const d=await api('/api/gift/init',{method:'POST',body:JSON.stringify({giftType:type})});if(d.selarLink)window.open(d.selarLink)}

async function loadSupport(){document.getElementById('tab-support').innerHTML=`<div class="card"><input class="input" id="support-subject" placeholder="Subject"><textarea class="input" id="support-msg" rows="3"></textarea><button class="btn-full" onclick="sendSupport()">Send</button></div>`}
async function sendSupport(){const s=document.getElementById('support-subject').value;const m=document.getElementById('support-msg').value;await api('/api/support/send',{method:'POST',body:JSON.stringify({subject:s,message:m})});toast('Sent')}

async function toggleFollow(){const res=await api('/api/follow',{method:'POST',body:JSON.stringify({followingId:profileId})});toast(res.action==='followed'?'Following':'Unfollowed');loadProfile()}
function logout(){localStorage.clear();location.href='auth.html'}

loadProfile();
</script>
</body>
</html>
