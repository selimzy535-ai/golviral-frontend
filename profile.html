<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - GolViral</title>
  <style>
    :root {
      --bg: #0d0e12;
      --card-bg: #16181e;
      --card-border: #232631;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --secondary: #27272a;
      --pink: #ec4899;
      --orange: #f97316;
      --blue: #3b82f6;
      --green: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 60px;
    }

    /* Top Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background-color: var(--bg);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--card-border);
    }
    .header-bar h2 {
      font-size: 18px;
      font-weight: 700;
    }

    /* Profile Header */
    .profile-header {
      padding: 16px;
      border-bottom: 1px solid var(--card-border);
    }
    .profile-top {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }
    .avatar-wrapper {
      position: relative;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--secondary);
      border: 2px solid var(--primary);
    }
    .profile-info {
      flex: 1;
    }
    .profile-name {
      font-size: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .profile-handle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 6px;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      background-color: rgba(99, 102, 241, 0.15);
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }
    .badge.kyc {
      background-color: rgba(34, 197, 94, 0.15);
      color: var(--green);
    }

    .icon-inline {
      width: 12px;
      height: 12px;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
    }

    /* Stats Row */
    .stats-row {
      display: flex;
      justify-content: space-around;
      text-align: center;
      padding: 12px 0;
      margin: 12px 0;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }
    .stat-val {
      font-size: 16px;
      font-weight: 800;
    }
    .stat-lbl {
      font-size: 12px;
      color: var(--muted);
    }

    /* Bio Section */
    .bio-section {
      margin-top: 12px;
    }
    .bio-text {
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-line;
      margin-bottom: 8px;
    }
    .bio-edit-box {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Action Buttons */
    .action-btns {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    /* Navigation Tabs */
    .tabs-nav {
      display: flex;
      border-bottom: 1px solid var(--card-border);
      background: var(--bg);
      position: sticky;
      top: 53px;
      z-index: 90;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* Tab Content Area */
    .tab-content {
      padding: 16px;
    }
    .tab-pane {
      display: none;
    }
    .tab-pane.active {
      display: block;
    }

    /* 3x3 Grid Layout for Posts */
    .grid-3x3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }
    .grid-item {
      position: relative;
      aspect-ratio: 1 / 1;
      background-color: var(--card-bg);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
    }
    .grid-item img,
    .grid-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .grid-item .overlay-views {
      position: absolute;
      bottom: 4px;
      left: 4px;
      font-size: 11px;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    /* Cards & Form Elements */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      background-color: var(--primary);
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover {
      background-color: var(--primary-hover);
    }
    .btn.secondary {
      background-color: var(--secondary);
      color: var(--text);
    }
    .btn.danger {
      background-color: var(--danger);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .input {
      width: 100%;
      padding: 10px 12px;
      background-color: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 8px;
      outline: none;
    }
    .input:focus {
      border-color: var(--primary);
    }

    /* Progress Bar */
    .progress {
      width: 100%;
      height: 6px;
      background-color: var(--secondary);
      border-radius: 3px;
      overflow: hidden;
      margin: 4px 0 10px 0;
    }
    .progress-bar {
      height: 100%;
      background-color: var(--primary);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    /* Gifts */
    .gift-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .gift-card svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      width: 100%;
      max-width: 400px;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      display: none;
      z-index: 2000;
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <div class="header-bar">
    <h2 id="header-username">Profile</h2>
    <button class="btn secondary" style="width:auto;padding:6px 12px;" onclick="logout()">Logout</button>
  </div>

  <!-- Profile Banner & Main Information -->
  <div class="profile-header">
    <div class="profile-top">
      <div class="avatar-wrapper">
        <img id="profile-avatar" class="avatar" src="/placeholder.png" alt="Avatar">
      </div>
      <div class="profile-info">
        <div class="profile-name" id="profile-name">
          Loading...
        </div>
        <div class="profile-handle" id="profile-handle">@handle</div>
        <div class="badges" id="badges"></div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div>
        <div class="stat-val" id="stat-posts">0</div>
        <div class="stat-lbl">Posts</div>
      </div>
      <div>
        <div class="stat-val" id="stat-followers">0</div>
        <div class="stat-lbl">Followers</div>
      </div>
      <div>
        <div class="stat-val" id="stat-following">0</div>
        <div class="stat-lbl">Following</div>
      </div>
    </div>

    <!-- Bio Section -->
    <div class="bio-section">
      <p class="bio-text" id="bio-text"></p>
      <div id="bio-edit-container" style="display:none" class="bio-edit-box">
        <textarea class="input" id="bio-input" rows="2" placeholder="Write your bio..."></textarea>
        <div style="display:flex;gap:8px">
          <button class="btn" onclick="saveBio()">Save Bio</button>
          <button class="btn secondary" onclick="clearBio()">Clear</button>
        </div>
      </div>
    </div>

    <!-- Main Action Buttons -->
    <div class="action-btns" id="profile-actions">
      <!-- Populated dynamically (Edit Profile / Follow / DM) -->
    </div>
  </div>

  <!-- Tabs Navigation -->
  <div class="tabs-nav">
    <button class="tab-btn active" onclick="switchTab('posts')">Posts</button>
    <button class="tab-btn" id="nav-wallet" onclick="switchTab('wallet')">Wallet</button>
    <button class="tab-btn" onclick="switchTab('gifts')">Gifts</button>
    <button class="tab-btn" onclick="switchTab('support')">Support</button>
  </div>

  <!-- Tab Content Containers -->
  <div class="tab-content">
    <!-- 3x3 Grid Tab for Posts -->
    <div id="tab-posts" class="tab-pane active">
      <div class="grid-3x3" id="posts-grid-container"></div>
    </div>

    <!-- Wallet Tab -->
    <div id="tab-wallet" class="tab-pane"></div>

    <!-- Gifts Tab -->
    <div id="tab-gifts" class="tab-pane"></div>

    <!-- Support Tab -->
    <div id="tab-support" class="tab-pane"></div>
  </div>

  <!-- Withdrawal OTP Modal -->
  <div id="otp-modal" class="modal">
    <div class="modal-content card">
      <b style="font-size:16px;display:block;margin-bottom:8px">Enter Authorization OTP</b>
      <p style="font-size:12px;color:var(--muted);margin-bottom:12px">Please enter the security verification code sent to you to confirm withdrawal.</p>
      <input class="input" id="otp-input" placeholder="OTP Code" type="text">
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn" onclick="confirmWithdraw()">Confirm</button>
        <button class="btn secondary" onclick="document.getElementById('otp-modal').classList.remove('active')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast"></div>

<script>
const TOKEN = localStorage.getItem('token') || '';
const API = localStorage.getItem('api') || '';
const params = new URLSearchParams(window.location.search);
let profileId = params.get('id') || localStorage.getItem('userId') || '';
let myId = localStorage.getItem('userId') || '';
let pendingWithdraw = {};
let followLock = false;

function toast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 3000);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function api(url, options = {}) {
  options.headers = options.headers || {};
  if (TOKEN) options.headers['Authorization'] = `Bearer ${TOKEN}`;
  options.headers['Content-Type'] = 'application/json';
  try {
    const res = await fetch(API + url, options);
    return await res.json();
  } catch (err) {
    return { error: 'Network Connection Error' };
  }
}

function switchTab(tabName) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
  
  event.target.classList.add('active');
  const targetPane = document.getElementById(`tab-${tabName}`);
  if (targetPane) targetPane.classList.add('active');

  if (tabName === 'wallet') loadWallet();
  if (tabName === 'gifts') loadGifts();
  if (tabName === 'support') loadSupport();
}

async function loadProfile() {
  const u = await api(`/api/profile/${profileId}`);
  if (u.error) return toast(u.error);

  document.getElementById('header-username').innerText = u.username || 'Profile';
  document.getElementById('profile-name').innerText = u.name || u.username;
  document.getElementById('profile-handle').innerText = `@${u.username}`;
  if (u.avatar) document.getElementById('profile-avatar').src = u.avatar;
  
  document.getElementById('stat-posts').innerText = u.postsCount || 0;
  document.getElementById('stat-followers').innerText = u.followersCount || 0;
  document.getElementById('stat-following').innerText = u.followingCount || 0;

  document.getElementById('bio-text').innerText = u.bio || '';

  const isMe = (profileId === myId);
  if (isMe) {
    document.getElementById('bio-edit-container').style.display = 'block';
    document.getElementById('bio-input').value = u.bio || '';
    document.getElementById('profile-actions').innerHTML = `
      <button class="btn secondary" onclick="switchTab('wallet')">Manage Wallet</button>
    `;
  } else {
    document.getElementById('profile-actions').innerHTML = `
      <button class="btn" id="follow-btn" onclick="toggleFollow()">${u.isFollowing ? 'Unfollow' : 'Follow'}</button>
      <button class="btn secondary" onclick="openChat('${u.id}')">Message</button>
    `;
  }

  loadUserPosts();
  loadKYCStatus();
}

/* 3x3 Grid Post Renderer */
async function loadUserPosts() {
  const container = document.getElementById('posts-grid-container');
  container.innerHTML = '';
  
  const posts = await api(`/api/posts/user/${profileId}`);
  if (!posts || !posts.length) {
    document.getElementById('tab-posts').innerHTML = `<p style="text-align:center;color:var(--muted);padding:24px">No posts yet.</p>`;
    return;
  }

  container.innerHTML = posts.map(p => `
    <div class="grid-item" onclick="location.href='post.html?id=${p.id}'">
      ${p.type === 'VIDEO' || (p.mediaUrl && p.mediaUrl.endsWith('.mp4')) 
        ? `<video src="${escapeHtml(p.mediaUrl)}" muted preload="metadata"></video>`
        : `<img src="${escapeHtml(p.mediaUrl || p.thumbnail || '/placeholder.png')}" alt="Media">`
      }
      <div class="overlay-views">
        <svg class="icon-inline" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        ${p.views ? p.views.toLocaleString() : 0}
      </div>
    </div>
  `).join('');
}

async function loadWallet() {
  const w = await api('/api/wallet/my') || {};
  const kyc = await api('/api/profile/kyc-status') || {};
  const cap = Math.min(100, (w.dailyCapPercent || 0));
  const days = Math.min(100, (w.daysPercent || 0));
  const foll = Math.min(100, (w.followersPercent || 0));

  document.getElementById('tab-wallet').innerHTML = `
  <div class="card">
    <p style="font-size:12px;color:var(--muted);margin-bottom:12px">
      Face Check: ${kyc.faceVerified ? '✓ Complete' : '✗ Pending'} | ID Scan: ${kyc.idVerified ? '✓ Complete' : '✗ Pending'}
    </p>
    <button class="btn" onclick="openKYCPortal()">Launch KYC Portal (New Window)</button>
  </div>

  <div class="card"><b>Monetization Status: ${w.monetized ? 'Monetized' : 'Not Monetized'}</b></div>
  <div class="card"><b>Free Credits: ${w.freeCredits || 0}</b></div>
  <div class="card"><b>Cash Balance: ₦${(w.cashBalance || 0).toLocaleString()}</b></div>
  <div class="card">
  <p style="font-size:12px">Daily Cap ${w.dailyCapProgress || '0/0'}</p><div class="progress"><div class="progress-bar" style="width:${cap}%"></div></div>
  <p style="font-size:12px">Days to Monetize ${w.daysProgress || '0/0'}</p><div class="progress"><div class="progress-bar" style="width:${days}%"></div></div>
  <p style="font-size:12px">Followers ${w.followersProgress || '0/0'}</p><div class="progress"><div class="progress-bar" style="width:${foll}%"></div></div>
  <p style="font-size:12px">Referrals Left: ${w.refsLeft || 0}/5</p>
  </div>

  <div class="card">
  <button class="btn" style="margin-bottom:8px" onclick="deposit(1500)">Deposit ₦1,500 = 15,000 pts</button>
  <button class="btn" style="margin-bottom:8px" onclick="deposit(7000)">Deposit ₦7,000 = 70,000 pts</button>
  <button class="btn secondary" onclick="unlockDM()">Unlock DM ₦3,000</button>
  </div>

  <div class="card">
  <p style="margin-bottom:8px;font-weight:800">Withdraw Cash</p>
  <p style="font-size:11px;color:var(--muted);margin-bottom:12px">Minimum: 50,000 pts = ₦5,000</p>
  <input class="input" id="withdraw-amount" type="number" placeholder="Amount in Points">
  <select class="input" id="withdraw-method" onchange="toggleWithdrawFields()">
    <option value="BANK">Bank Transfer - Naira</option>
    <option value="USDT">USDT TRC20 - $10 / $100 only</option>
  </select>
  <div id="bank-fields">
    <input class="input" id="bank-name" placeholder="Bank Name e.g. GTBank">
    <input class="input" id="account-number" placeholder="Account Number">
    <input class="input" id="account-name" placeholder="Account Name">
  </div>
  <div id="usdt-fields" style="display:none">
    <input class="input" id="usdt-address" placeholder="TRC20 Address starts with T">
  </div>
  <button class="btn" onclick="requestWithdraw()">Request Withdraw</button>
  </div>`;
}

function toggleWithdrawFields(){
  const method = document.getElementById('withdraw-method').value;
  document.getElementById('bank-fields').style.display = method==='BANK' ? 'block' : 'none';
  document.getElementById('usdt-fields').style.display = method==='USDT' ? 'block' : 'none';
}

async function deposit(amount){const d=await api('/api/deposit/init',{method:'POST',body:JSON.stringify({tierAmount:amount})});if(d.selarLink)window.open(d.selarLink)}
async function unlockDM(){const d=await api('/api/dm/init',{method:'POST'});if(d.selarLink)window.open(d.selarLink)}

async function requestWithdraw(){
  const amount=document.getElementById('withdraw-amount').value;
  const method=document.getElementById('withdraw-method').value;
  if(Number(amount) < 50000) return toast('Min withdrawal is 50,000 pts');
  
  let targetDetails = {};
  if(method==='BANK'){
    const bankName=document.getElementById('bank-name').value;
    const accountNumber=document.getElementById('account-number').value;
    const accountName=document.getElementById('account-name').value;
    if(!bankName || !accountNumber || !accountName) return toast('Fill all bank details');
    targetDetails = { bankName, accountNumber, accountName };
  }else{
    const usdt=document.getElementById('usdt-address').value;
    if(!usdt) return toast('Enter TRC20 Address');
    if(Number(amount)!==120000 && Number(amount)!==12000000) return toast('USDT only 120k or 12M pts');
    targetDetails = { address: usdt };
  }
  
  pendingWithdraw={amountPoints:Number(amount),method,targetDetails};
  const res=await api('/api/wallet/withdraw',{method:'POST',body:JSON.stringify(pendingWithdraw)});
  if(res.authChallenge) document.getElementById('otp-modal').classList.add('active');
  else if(res.error) toast(res.error);
}

async function confirmWithdraw(){
  const otpVal=document.getElementById('otp-input').value;
  const res=await api('/api/wallet/withdraw/confirm',{method:'POST',body:JSON.stringify({...pendingWithdraw,otp:otpVal})});
  if(res.transactionAcknowledged){
    toast('Withdraw Requested');
    loadWallet();
  } else {
    toast(res.error || 'Failed');
  }
  document.getElementById('otp-modal').classList.remove('active');
}

function loadGifts(){
  document.getElementById('tab-gifts').innerHTML=`
  <div class="gift-card" onclick="buyGift('RUBY')">
    <svg viewBox="0 0 24 24" style="color:var(--pink)"><path d="M6 3h12l4 6-10 13L2 9l4-6z"/></svg>
    <div><b>RUBY</b><p style="color:var(--muted);font-size:12px">₦5,000 - 200pts x 100 gifts</p></div>
  </div>
  <div class="gift-card" onclick="buyGift('GOLD')">
    <svg viewBox="0 0 24 24" style="color:var(--orange)"><circle cx="12" cy="12" r="10"/></svg>
    <div><b>GOLD</b><p style="color:var(--muted);font-size:12px">₦10,000 - 500pts x 100 gifts</p></div>
  </div>
  <div class="gift-card" onclick="buyGift('DIAMOND')">
    <svg viewBox="0 0 24 24" style="color:var(--blue)"><path d="M2 9l10 13L22 9"/></svg>
    <div><b>DIAMOND</b><p style="color:var(--muted);font-size:12px">₦15,000 - 1,000pts x 100 gifts</p></div>
  </div>`;
}
async function buyGift(type){const d=await api('/api/gift/init',{method:'POST',body:JSON.stringify({giftType:type})});if(d.selarLink)window.open(d.selarLink)}

async function loadSupport(){
  document.getElementById('tab-support').innerHTML=`
  <div class="card">
    <input class="input" id="support-subject" placeholder="Subject">
    <textarea class="input" id="support-msg" placeholder="Describe your issue" rows="4"></textarea>
    <button class="btn" onclick="sendSupport()">Send Ticket</button>
  </div>
  <div id="tickets"></div>`;
  
  const t=await api('/api/support/my');
  document.getElementById('tickets').innerHTML=(t||[]).map(x=>`
    <div class="card">
      <b>${escapeHtml(x.subject)}</b>
      <p style="color:var(--muted);font-size:12px;margin:4px 0">You: ${escapeHtml(x.message)}</p>
      ${x.reply ? `<p style="color:var(--green);margin-top:8px;font-size:12px"><b>Admin:</b> ${escapeHtml(x.reply)}</p>` : ''}
      <p style="color:${x.status==='RESOLVED'?'var(--green)':'var(--orange)'};font-size:11px;margin-top:8px">${escapeHtml(x.status)}</p>
    </div>
  `).join('');
}

async function sendSupport(){
  const subject=document.getElementById('support-subject').value;
  const message=document.getElementById('support-msg').value;
  if(!subject || !message) return toast('Fill all fields');
  
  const res = await api('/api/support/send',{method:'POST',body:JSON.stringify({subject,message})});
  if(res.error) return toast(res.error);
  
  toast('Ticket sent');
  loadSupport();
}

async function toggleFollow(){
  if(followLock) return;
  followLock=true;
  const btn=document.getElementById('follow-btn');
  btn.disabled=true;
  const isFollowing=btn.innerText==='Unfollow';
  btn.innerText=isFollowing ? 'Follow' : 'Unfollow';

  const res=await api(isFollowing ? '/api/unfollow' : '/api/follow',{method:'POST',body:JSON.stringify({followingId:profileId})});
  if(res.error){
    btn.innerText=isFollowing ? 'Unfollow' : 'Follow';
    toast(res.error);
  }else{
    toast(isFollowing ? 'Unfollowed' : 'Following');
    loadProfile(); // refresh counts
  }
  setTimeout(()=>{btn.disabled=false; followLock=false},2000);
}

function openChat(userId){
  localStorage.chatWith = userId || profileId;
  location.href = 'messages.html?user=' + (userId || profileId);
}

function logout(){localStorage.clear();location.href='auth.html'}

async function loadKYCStatus() {
  const kyc = await api('/api/profile/kyc-status');
  const badgesWrap = document.getElementById('badges');
  
  if (kyc && kyc.faceVerified && kyc.idVerified) {
    if(!badgesWrap.querySelector('.badge.kyc')) {
      badgesWrap.insertAdjacentHTML('beforeend', `<span class="badge kyc"><svg class="icon-inline" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>KYC Verified</span>`);
    }
  }
}

async function saveBio() {
  const bio = document.getElementById('bio-input').value;
  const res = await api('/api/profile/bio', { method: 'POST', body: JSON.stringify({ bio }) });
  if (res.success) {
    toast('Bio updated');
    document.getElementById('bio-text').innerText = res.bio;
  } else toast(res.error || 'Failed');
}

async function clearBio() {
  const res = await api('/api/profile/bio', { method: 'DELETE' });
  if (res.success) {
    toast('Bio cleared');
    document.getElementById('bio-input').value = '';
    document.getElementById('bio-text').innerText = '';
  }
}

function openKYCPortal() {
  const kycUrl = `kyc.html?token=${encodeURIComponent(TOKEN)}&api=${encodeURIComponent(API)}`;
  const kycWin = window.open(kycUrl, "_blank");
  if (!kycWin) return toast("Please allow popups to open KYC window");
}

loadProfile();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/golviral-frontend/sw.js').catch(()=>{});
}
</script>
