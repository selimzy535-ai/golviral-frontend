<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GolViral - Profile</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#000;--card:#0d0d0d;--glass:rgba(15,15,15,0.75);--text:#fff;--muted:#777;--border:#1e1e1e;
  --green:#00ff88;--purple:#a855f7;--pink:#ec4899;--blue:#3b82f6;--orange:#f97316;--red:#ef4444;
  --gradient:linear-gradient(135deg,#00ff88,#3b82f6,#a855f7)
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);max-width:500px;margin:0 auto;min-height:100dvh;padding-bottom:30px}
header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;cursor:pointer}
.icon-inline{width:16px;height:16px;vertical-align:middle;display:inline-block}

/* TIKTOK PROFILE HEADER */
.tiktok-profile{padding:20px 16px;text-align:center;background:radial-gradient(circle at 50% 0%,rgba(0,255,136,0.08),transparent 65%)}
.avatar-wrap{position:relative;width:96px;height:96px;margin:0 auto 12px}
.avatar{width:100%;height:100%;border-radius:50%;background:var(--gradient);padding:3px;box-shadow:0 0 25px rgba(0,255,136,0.25)}
.avatar img{width:100%;height:100%;border-radius:50%;background:var(--card);object-fit:cover}
.badges-wrap{display:flex;justify-content:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700}
.badge.verified{background:rgba(59,130,246,0.15);color:var(--blue);border:1px solid rgba(59,130,246,0.3)}
.badge.creator{background:rgba(168,85,247,0.15);color:var(--purple);border:1px solid rgba(168,85,247,0.3)}
.badge.kyc{background:rgba(0,255,136,0.15);color:var(--green);border:1px solid rgba(0,255,136,0.3)}

/* TIKTOK STATS GRID */
.tiktok-stats{display:flex;justify-content:center;align-items:center;gap:24px;margin:16px 0;padding:10px 0}
.tiktok-stat-item{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.tiktok-stat-item b{font-size:18px;font-weight:800;color:var(--text)}
.tiktok-stat-item span{font-size:12px;color:var(--muted);margin-top:2px}

.profile-actions{display:flex;justify-content:center;gap:10px;margin-top:14px}
.btn-pill{padding:9px 20px;border-radius:24px;font-weight:700;font-size:14px;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-pill.primary{background:var(--gradient);color:#000}
.btn-pill.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg)}
.tab{flex:1;padding:12px 0;color:var(--muted);cursor:pointer;display:flex;justify-content:center;align-items:center;gap:6px;font-weight:700;font-size:13px;border-bottom:2px solid transparent}
.tab.active{color:var(--green);border-bottom-color:var(--green)}

.content{padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.grid-item{aspect-ratio:1;background:#141414;border-radius:8px;border:1px solid var(--border)}
.input{width:100%;background:#141414;border:1px solid var(--border);color:var(--text);padding:12px;border-radius:12px;margin-bottom:10px;outline:none}
.input:focus{border-color:var(--green)}
.btn{background:var(--gradient);color:#000;border:none;padding:12px;border-radius:12px;font-weight:800;width:100%;cursor:pointer;font-size:14px}
.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn[disabled]{opacity:0.4;pointer-events:none}
.progress{height:8px;background:#1a1a1a;border-radius:10px;overflow:hidden;margin:6px 0 12px}
.progress-bar{height:100%;background:var(--gradient);border-radius:10px;transition:width 0.3s}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);display:none;justify-content:center;align-items:center;z-index:200}
.modal.active{display:flex}
.glass-modal{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;width:90%;max-width:400px}
.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-100px);background:var(--green);color:#000;padding:10px 20px;border-radius:20px;font-weight:800;font-size:13px;z-index:999;transition:0.3s;opacity:0}
.toast.show{transform:translate(-50%,0);opacity:1}
.gift-card{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;margin-bottom:10px;cursor:pointer;border:1px solid var(--border);background:#121212}

/* DAILY ANALYTICS GRAPH STYLING */
.graph-container{margin-top:12px;background:#121212;border:1px solid var(--border);border-radius:12px;padding:14px}
.graph-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:12px}
.graph-bars{display:flex;align-items:flex-end;justify-content:space-between;height:110px;gap:8px;padding-top:10px}
.bar-column{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:24px;background:var(--gradient);border-radius:4px 4px 0 0;min-height:4px;transition:height 0.4s ease}
.bar-label{font-size:10px;color:var(--muted)}
.trend-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700}
.trend-up{background:rgba(0,255,136,0.15);color:var(--green)}
.trend-down{background:rgba(239,68,68,0.15);color:var(--red)}

.copy-box{display:flex;justify-content:space-between;align-items:center;background:#141414;border:1px solid var(--border);padding:10px;border-radius:10px;margin-top:8px;font-size:12px;word-break:break-all}
.bio-display{font-size:13px;color:var(--muted);margin:10px 0;line-height:1.4}
</style>
</head>
<body>

<header>
<svg onclick="location.href='index.html'" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
<b id="username">@user</b>
<svg onclick="logout()" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
</header>

<div id="toast" class="toast"></div>

<div class="tiktok-profile">
  <div class="avatar-wrap">
    <div class="avatar"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300ff88'%3E%3Cpath d='M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'/%3E%3Ccircle cx='12' cy='7' r='4'/%3E%3C/svg%3E"></div>
  </div>
  
  <h2 id="username-display" style="font-size:18px;font-weight:800;"></h2>
  <div id="badges" class="badges-wrap"></div>
  <p id="bio-text" class="bio-display"></p>
  <p id="joined-date" style="color:var(--muted);font-size:11px;margin-bottom:8px"></p>

  <div class="tiktok-stats">
    <div class="tiktok-stat-item">
      <b id="following">0</b>
      <span>Following</span>
    </div>
    <div class="tiktok-stat-item">
      <b id="followers">0</b>
      <span>Followers</span>
    </div>
    <div class="tiktok-stat-item">
      <b id="likes">0</b>
      <span>Likes</span>
    </div>
    <div class="tiktok-stat-item">
      <b id="views">0</b>
      <span>Views</span>
    </div>
  </div>

  <div class="profile-actions">
    <button id="follow-btn" class="btn-pill primary" onclick="toggleFollow()">Follow</button>
    <button id="message-btn" class="btn-pill secondary" onclick="openChat()" style="display:none">Message</button>
  </div>

  <div id="bio-editor" style="display:none;margin-top:14px;">
    <textarea id="bio-input" class="input" style="height:60px;resize:none;" placeholder="Update bio (max 150 chars)..." maxlength="150"></textarea>
    <div style="display:flex;gap:8px;">
      <button class="btn" style="padding:8px;font-size:12px;" onclick="saveBio()">Save Bio</button>
      <button class="btn secondary" style="padding:8px;font-size:12px;" onclick="clearBio()">Clear</button>
    </div>
  </div>

  <div id="links-box" style="display:none;margin-top:14px;text-align:left">
    <b style="font-size:12px;">Referral & Profile Links</b>
    <div class="copy-box">
      <div><div style="font-size:10px;color:var(--muted)">Profile Link</div><span id="profile-link"></span></div>
      <svg onclick="copyLink('profile-link')" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </div>
    <div class="copy-box">
      <div><div style="font-size:10px;color:var(--muted)">Referral Link</div><span id="referral-link"></span></div>
      <svg onclick="copyLink('referral-link')" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('posts',this)">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>Posts
  </div>
  <div class="tab" onclick="showTab('analytics',this)">
    <svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>Analytics
  </div>
  <div class="tab" onclick="showTab('wallet',this)">
    <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01M20 12h-4"/></svg>Wallet
  </div>
  <div class="tab" onclick="showTab('gifts',this)">
    <svg viewBox="0 0 24 24"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>Gifts
  </div>
  <div class="tab" onclick="showTab('support',this)">
    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Support
  </div>
</div>

<div class="content">
  <div id="tab-posts"></div>
  <div id="tab-analytics" style="display:none"></div>
  <div id="tab-wallet" style="display:none"></div>
  <div id="tab-gifts" style="display:none"></div>
  <div id="tab-support" style="display:none"></div>
</div>

<div id="otp-modal" class="modal">
  <div class="glass-modal">
    <h3 style="margin-bottom:12px">Verify Withdrawal</h3>
    <p style="color:var(--muted);font-size:12px;margin-bottom:12px">Enter OTP sent to your registered email</p>
    <input class="input" id="otp-input" placeholder="123456">
    <button class="btn" onclick="confirmWithdraw()">Confirm Withdraw</button>
  </div>
</div>

<script>
const API='https://golviral-api.onrender.com';
const TOKEN=localStorage.token;
if(!TOKEN) location.href='auth.html';
const profileId=new URLSearchParams(location.search).get('id')||localStorage.userId;
const isSelf=profileId===localStorage.userId;
let pendingWithdraw=null;
let followLock=false;

function toast(msg){const t=document.getElementById('toast');t.innerText=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
async function api(path,opt={}){try{const res=await fetch(API+path,{...opt,headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json',...opt.headers}});if(res.status===401)location.href='auth.html';return res.json()}catch{toast('Network error');return {}}}

function getPercent(str){if(!str)return 0;const [a,b]=str.split('/').map(Number);return b?Math.min(100,Math.round(a/b*100)):0}

// LOAD PROFILE
async function loadProfile(){
const u=await api(`/api/user/${profileId}`);
document.getElementById('username').innerText='@'+u.username;
document.getElementById('username-display').innerText=u.username;
document.getElementById('followers').innerText=u.followers||0;
document.getElementById('following').innerText=u.following||0;
document.getElementById('likes').innerText=u.totalLikes||0;
document.getElementById('views').innerText=u.totalViews||0;

document.getElementById('bio-text').innerText = u.bio || '';
const date = new Date(u.createdAt).toLocaleDateString('en-US',{month:'short', year:'numeric'});
document.getElementById('joined-date').innerText = `Joined ${date}`;

let badges='';
if(u.isVerified) badges+=`<span class="badge verified"><svg class="icon-inline" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Verified</span>`;
if(u.dmUnlocked) badges+=`<span class="badge creator"><svg class="icon-inline" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Creator</span>`;
document.getElementById('badges').innerHTML=badges;

if(isSelf){
  document.getElementById('links-box').style.display='block';
  document.getElementById('profile-link').innerText=u.profileLink;
  document.getElementById('referral-link').innerText=u.referralLink;
  document.querySelector('.profile-actions').style.display='none';
  document.getElementById('bio-editor').style.display='block';
  document.getElementById('bio-input').value = u.bio || '';
  loadKYCStatus();
}else{
  document.getElementById('follow-btn').innerText=u.isFollowing?'Unfollow':'Follow';
  const msgBtn = document.getElementById('message-btn');
  msgBtn.style.display = 'inline-flex';
  if(u.dmUnlocked || u.isVerified){
    msgBtn.innerText = 'Message';
    msgBtn.onclick = () => openChat(profileId);
  } else {
    msgBtn.innerText = 'Unlock DM';
    msgBtn.onclick = async () => {
      const d = await api('/api/dm/init',{method:'POST'});
      if(d.selarLink) window.open(d.selarLink);
    }
  }
}
loadPosts();
}

function copyLink(id){
  navigator.clipboard.writeText(document.getElementById(id).innerText);
  toast('Copied to clipboard');
}

async function loadPosts(){
const d=await api(`/api/user/${profileId}/posts`);
document.getElementById('tab-posts').innerHTML=`<div class="grid">${(d||[]).map(()=>`<div class="grid-item"></div>`).join('')}</div>`;
}

function showTab(tab,el){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
document.querySelectorAll('[id^=tab-]').forEach(d=>d.style.display='none');
document.getElementById('tab-'+tab).style.display='block';
if(tab==='analytics')loadAnalytics();
if(tab==='wallet')loadWallet();
if(tab==='gifts')loadGifts();
if(tab==='support')loadSupport();
}

// DAILY ENGAGEMENT GRAPH & ANALYTICS TABLE
async function loadAnalytics(){
  const u = await api(`/api/user/${profileId}`);
  const dailyScores = u.dailyScoreTrend || [
    { day: 'Mon', views: 120, likes: 15, trend: 'up' },
    { day: 'Tue', views: 240, likes: 35, trend: 'up' },
    { day: 'Wed', views: 180, likes: 20, trend: 'down' },
    { day: 'Thu', views: 310, likes: 45, trend: 'up' },
    { day: 'Fri', views: 450, likes: 80, trend: 'up' },
    { day: 'Sat', views: 390, likes: 60, trend: 'down' },
    { day: 'Sun', views: u.totalViews || 520, likes: u.totalLikes || 95, trend: 'up' }
  ];

  const maxViews = Math.max(...dailyScores.map(s=>s.views), 1);
  const latestTrend = dailyScores[dailyScores.length - 1].trend;

  document.getElementById('tab-analytics').innerHTML = `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <h4 style="font-size:15px">Daily Score & Engagement</h4>
        <p style="font-size:11px;color:var(--muted)">Performance trends over recent days</p>
      </div>
      <span class="trend-pill ${latestTrend === 'up' ? 'trend-up' : 'trend-down'}">
        <svg class="icon-inline" viewBox="0 0 24 24"><polyline points="${latestTrend==='up'?'23 6 13.5 15.5 8.5 10.5 1 18':'23 18 13.5 8.5 8.5 13.5 1 6'}"/></svg>
        ${latestTrend === 'up' ? 'Trending Up' : 'Trending Down'}
      </span>
    </div>

    <div class="graph-container">
      <div class="graph-header">
        <span>Daily Engagement Metrics</span>
        <span style="color:var(--green);font-weight:700">Views & Likes</span>
      </div>
      <div class="graph-bars">
        ${dailyScores.map(item => `
          <div class="bar-column">
            <div class="bar" style="height:${Math.max(10, Math.round((item.views / maxViews) * 100))}%;"></div>
            <span class="bar-label">${item.day}</span>
          </div>
        `).join('')}
      </div>
    </div>

    <table style="width:100%;margin-top:14px;border-collapse:collapse;font-size:12px;text-align:left;">
      <thead>
        <tr style="border-bottom:1px solid var(--border);color:var(--muted);">
          <th style="padding:8px 4px">Day</th>
          <th style="padding:8px 4px">Daily Views</th>
          <th style="padding:8px 4px">Daily Likes</th>
          <th style="padding:8px 4px">Score Status</th>
        </tr>
      </thead>
      <tbody>
        ${dailyScores.map(row => `
          <tr style="border-bottom:1px solid #181818">
            <td style="padding:8px 4px;font-weight:700">${row.day}</td>
            <td style="padding:8px 4px">${row.views}</td>
            <td style="padding:8px 4px">${row.likes}</td>
            <td style="padding:8px 4px">
              <span class="trend-pill ${row.trend === 'up' ? 'trend-up' : 'trend-down'}" style="padding:2px 6px;font-size:10px;">
                ${row.trend === 'up' ? '▲ High' : '▼ Low'}
              </span>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  </div>`;
}

// WALLET & KYC RULES
async function loadWallet(){
const w=await api('/api/wallet');
const kyc=await api('/api/profile/kyc-status');

const cap=getPercent(w.dailyCapProgress); const days=getPercent(w.daysProgress); const foll=getPercent(w.followersProgress);
document.getElementById('tab-wallet').innerHTML=`
<div class="card" style="background:linear-gradient(135deg,rgba(0,255,136,0.08),transparent)">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <b>Identity Verification Rules</b>
    <span style="font-size:11px;color:var(--muted);">${kyc.canWithdraw ? '[ Verified ]' : '[ Action Needed ]'}</span>
  </div>
  
  <div style="font-size:12px;line-height:1.6;color:var(--muted);background:#121212;padding:10px;border-radius:10px;margin-bottom:12px;border:1px solid var(--border)">
    <p style="color:var(--text);margin-bottom:4px"><svg class="icon-inline" style="color:var(--green)" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> <b>Face Verification:</b> Required for Account Monetization & Referral Bonus counting.</p>
    <p style="color:var(--text)"><svg class="icon-inline" style="color:var(--blue)" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> <b>ID Document:</b> Required for 1st Cash Withdrawal payout.</p>
  </div>

  <p style="font-size:12px;color:var(--muted);margin-bottom:12px">
    Face Check: ${kyc.faceVerified ? '✓ Complete' : '✗ Pending'} | ID Scan: ${kyc.idVerified ? '✓ Complete' : '✗ Pending'}
  </p>
  <button class="btn" onclick="openKYCPortal()">Launch KYC Portal (New Window)</button>
</div>

<div class="card"><b>Monetization Status: ${w.monetized? 'Monetized' : 'Not Monetized'}</b></div>
<div class="card"><b>Free Credits: ${w.freeCredits}</b></div>
<div class="card"><b>Cash Balance: ₦${w.cashBalance}</b></div>
<div class="card">
<p style="font-size:12px">Daily Cap ${w.dailyCapProgress}</p><div class="progress"><div class="progress-bar" style="width:${cap}%"></div></div>
<p style="font-size:12px">Days to Monetize ${w.daysProgress}</p><div class="progress"><div class="progress-bar" style="width:${days}%"></div></div>
<p style="font-size:12px">Followers ${w.followersProgress}</p><div class="progress"><div class="progress-bar" style="width:${foll}%"></div></div>
<p style="font-size:12px">Referrals Left: ${w.refsLeft}/5</p>
</div>

<div class="card">
<button class="btn" style="margin-bottom:8px" onclick="deposit(1500)">Deposit ₦1500 = 15,000 pts</button>
<button class="btn" style="margin-bottom:8px" onclick="deposit(7000)">Deposit ₦7000 = 70,000 pts</button>
<button class="btn secondary" onclick="unlockDM()">Unlock DM ₦3000</button>
</div>

<div class="card">
<p style="margin-bottom:8px;font-weight:800">Withdraw Cash</p>
<p style="font-size:11px;color:var(--muted);margin-bottom:12px">Minimum: 50,000 pts = ₦5000</p>
<input class="input" id="withdraw-amount" type="number" placeholder="Amount in Points">
<select class="input" id="withdraw-method" onchange="toggleWithdrawFields()">
  <option value="BANK">Bank Transfer - Naira</option>
  <option value="USDT">USDT TRC20 - $10 / $100 only</option>
</select>
<div id="bank-fields">
  <input class="input" id="bank-name" placeholder="Bank Name e.g. GTBank">
  <input class="input" id="account-number" placeholder="Account Number">
  <input class="input" id="account-name" placeholder="Account Name">
</div>
<div id="usdt-fields" style="display:none">
  <input class="input" id="usdt-address" placeholder="TRC20 Address starts with T">
</div>
<button class="btn" onclick="requestWithdraw()">Request Withdraw</button>

<script>
const API = '${API}';
const TOKEN = '${TOKEN}';
let video = document.getElementById('webcam');
let faceStatus = document.getElementById('faceStatus');
let startFaceBtn = document.getElementById('startFaceBtn');
let ocrStatus = document.getElementById('ocrStatus');

let faceStream = null, idStream = null;
let detectorOptions, modelsLoaded = false, isScanning = false;

// Dynamic Action Array
const POSSIBLE_ACTIONS = ['LOOK_LEFT', 'LOOK_RIGHT', 'BLINK'];
let randomizedPrompts = [];
let currentStepIndex = 0;

function stopFaceCamera() {
  if (faceStream) {
    faceStream.getTracks().forEach(track => track.stop());
    faceStream = null;
  }
  video.srcObject = null;
}

async function checkExistingKYC() {
  try {
    const res = await fetch(API + '/api/profile/kyc-status', {

    });

  } catch(e) {

}

async function initAI() {
  try {
    faceStatus.innerText = "Loading AI Models...";
    const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model';
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL)
    ]);
    detectorOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.4 });
    faceStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 480, height: 360 } });
    video.srcObject = faceStream;
    modelsLoaded = true;
    faceStatus.innerText = "Camera Ready. Click Start Below";
    startFaceBtn.disabled = false;
  } catch(e) {
    faceStatus.innerText = "Camera / AI Load Error";
  }
}

async function generateSHA256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function getEAR(eye) {
  const p2_p6 = Math.hypot(eye[1].x - eye[5].x, eye[1].y - eye[5].y);
  const p3_p5 = Math.hypot(eye[2].x - eye[4].x, eye[2].y - eye[4].y);
  const p1_p4 = Math.hypot(eye[0].x - eye[3].x, eye[0].y - eye[3].y);
  return (p2_p6 + p3_p5) / (2.0 * p1_p4);
}

// RANDOMIZE PROMPTS
function runRandomFaceLiveness() {
  if(!modelsLoaded || isScanning) return;
  
  // Shuffle available liveness checks
  randomizedPrompts = [...POSSIBLE_ACTIONS].sort(() => Math.random() - 0.5);
  currentStepIndex = 0;
  isScanning = true;
  startFaceBtn.disabled = true;
  
  updatePromptInstruction();
  scanLoop();
}

function updatePromptInstruction() {
  const action = randomizedPrompts[currentStepIndex];
  const stepNum = currentStepIndex + 1;
  if (action === 'LOOK_LEFT') faceStatus.innerText = "Step " + stepNum + "/3: Turn Head LEFT";
  if (action === 'LOOK_RIGHT') faceStatus.innerText = "Step " + stepNum + "/3: Turn Head RIGHT";
  if (action === 'BLINK') faceStatus.innerText = "Step " + stepNum + "/3: BLINK Your Eyes";
}

async function scanLoop() {
  if(!isScanning) return;
  const detection = await faceapi.detectSingleFace(video, detectorOptions).withFaceLandmarks(true);
  
  if(detection) {
    const noseX = detection.landmarks.getNose()[3].x;
    const jaw = detection.landmarks.getJawOutline();
    const ratio = (noseX - jaw[0].x) / (jaw[16].x - jaw[0].x);
    
    const leftEye = detection.landmarks.getLeftEye();
    const rightEye = detection.landmarks.getRightEye();
    const ear = (getEAR(leftEye) + getEAR(rightEye)) / 2.0;

    const currentAction = randomizedPrompts[currentStepIndex];
    let passedStep = false;

    if (currentAction === 'LOOK_LEFT' && ratio < 0.38) passedStep = true;
    else if (currentAction === 'LOOK_RIGHT' && ratio > 0.62) passedStep = true;
    else if (currentAction === 'BLINK' && ear < 0.22) passedStep = true;

    if (passedStep) {
      currentStepIndex++;
      if (currentStepIndex >= randomizedPrompts.length) {
        // Complete Verification
        isScanning = false;
        faceStatus.innerText = "Validating Face Data...";
        
        const rawDescriptor = JSON.stringify(detection.landmarks.positions);
        const faceHash = await generateSHA256(rawDescriptor);

        const res = await fetch(API + '/api/profile/face-verify', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
          body: JSON.stringify({ faceHash })
        });
        const data = await res.json();

        if(res.ok) {
          faceStatus.innerText = "Face Verification Complete";
          stopFaceCamera();
          alert("Face Liveness Verification Successful!");
        } else {
          faceStatus.innerText = data.error || "Failed";
          startFaceBtn.disabled = false;
        }
        return;
      } else {
        updatePromptInstruction();
      }
    }
  }
  requestAnimationFrame(scanLoop);
}

async function captureAndProcessID() {
  const idVideo = document.getElementById('idVideo');
  const canvas = document.createElement('canvas');
  canvas.width = idVideo.videoWidth || 640;
  canvas.height = idVideo.videoHeight || 480;
  canvas.getContext('2d').drawImage(idVideo, 0, 0, canvas.width, canvas.height);
  
  stopIDCamera();
  runOCR(canvas);
}

async function processIDFile(input) {
  const file = input.files[0];
  if(!file) return;
  runOCR(file);
}

async function runOCR(imageSource) {
  ocrStatus.innerText = "Scanning Document text with OCR Engine...";
  try {
    const worker = await Tesseract.createWorker('eng');
    const ret = await worker.recognize(imageSource);
    await worker.terminate();

    const text = ret.data.text;
    const matches = text.match(/[A-Z0-9]{8,14}/g);

    if(matches && matches.length > 0) {
      const idHash = await generateSHA256(matches[0]);
      ocrStatus.innerText = "Submitting ID hash...";

      const res = await fetch(API + '/api/profile/id-verify', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
        body: JSON.stringify({ idHash })
      });
      const data = await res.json();

      if(res.ok) {
        ocrStatus.innerText = "ID Document Verified";
        alert("ID Document Verification Successful!");
      } else {
        ocrStatus.innerText = data.error || "Verification failed";
      }
    } else {
      ocrStatus.innerText = "No clear ID text found. Re-snap in direct light.";
    }
  } catch(err) {
    ocrStatus.innerText = "Error processing document image.";
  }
}
