<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GolViral - Profile</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#000;--card:#0d0d0d;--glass:rgba(15,15,15,0.75);--text:#fff;--muted:#777;--border:#1e1e1e;
  --green:#00ff88;--purple:#a855f7;--pink:#ec4899;--blue:#3b82f6;--orange:#f97316;--red:#ef4444;
  --gradient:linear-gradient(135deg,#00ff88,#3b82f6,#a855f7)
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);max-width:500px;margin:0 auto;min-height:100dvh;padding-bottom:30px}
header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;cursor:pointer}
.icon-inline{width:16px;height:16px;vertical-align:middle;display:inline-block}

/* TIKTOK PROFILE HEADER */
.tiktok-profile{padding:20px 16px;text-align:center;background:radial-gradient(circle at 50% 0%,rgba(0,255,136,0.08),transparent 65%)}
.avatar-wrap{position:relative;width:96px;height:96px;margin:0 auto 12px}
.avatar{width:100%;height:100%;border-radius:50%;background:var(--gradient);padding:3px;box-shadow:0 0 25px rgba(0,255,136,0.25)}
.avatar img{width:100%;height:100%;border-radius:50%;background:var(--card);object-fit:cover}
.badges-wrap{display:flex;justify-content:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700}
.badge.verified{background:rgba(59,130,246,0.15);color:var(--blue);border:1px solid rgba(59,130,246,0.3)}
.badge.creator{background:rgba(168,85,247,0.15);color:var(--purple);border:1px solid rgba(168,85,247,0.3)}
.badge.kyc{background:rgba(0,255,136,0.15);color:var(--green);border:1px solid rgba(0,255,136,0.3)}

/* TIKTOK STATS GRID */
.tiktok-stats{display:flex;justify-content:center;align-items:center;gap:24px;margin:16px 0;padding:10px 0}
.tiktok-stat-item{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.tiktok-stat-item b{font-size:18px;font-weight:800;color:var(--text)}
.tiktok-stat-item span{font-size:12px;color:var(--muted);margin-top:2px}

.profile-actions{display:flex;justify-content:center;gap:10px;margin-top:14px}
.btn-pill{padding:9px 20px;border-radius:24px;font-weight:700;font-size:14px;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-pill.primary{background:var(--gradient);color:#000}
.btn-pill.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg)}
.tab{flex:1;padding:12px 0;color:var(--muted);cursor:pointer;display:flex;justify-content:center;align-items:center;gap:6px;font-weight:700;font-size:13px;border-bottom:2px solid transparent}
.tab.active{color:var(--green);border-bottom-color:var(--green)}

.content{padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.grid-item{aspect-ratio:1;background:#141414;border-radius:8px;border:1px solid var(--border)}
.input{width:100%;background:#141414;border:1px solid var(--border);color:var(--text);padding:12px;border-radius:12px;margin-bottom:10px;outline:none}
.input:focus{border-color:var(--green)}
.btn{background:var(--gradient);color:#000;border:none;padding:12px;border-radius:12px;font-weight:800;width:100%;cursor:pointer;font-size:14px}
.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn[disabled]{opacity:0.4;pointer-events:none}
.progress{height:8px;background:#1a1a1a;border-radius:10px;overflow:hidden;margin:6px 0 12px}
.progress-bar{height:100%;background:var(--gradient);border-radius:10px;transition:width 0.3s}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);display:none;justify-content:center;align-items:center;z-index:200}
.modal.active{display:flex}
.glass-modal{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;width:90%;max-width:400px}
.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-100px);background:var(--green);color:#000;padding:10px 20px;border-radius:20px;font-weight:800;font-size:13px;z-index:999;transition:0.3s;opacity:0}
.toast.show{transform:translate(-50%,0);opacity:1}
.gift-card{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;margin-bottom:10px;cursor:pointer;border:1px solid var(--border);background:#121212}

/* LINE AREA CHART STYLING */
.chart-box{margin-top:12px;background:#121212;border:1px solid var(--border);border-radius:14px;padding:14px}
.trend-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700}
.trend-up{background:rgba(0,255,136,0.15);color:var(--green)}
.trend-down{background:rgba(239,68,68,0.15);color:var(--red)}

/* AUTO EARNINGS CARD */
.earn-badge{background:linear-gradient(135deg,rgba(0,255,136,0.15),rgba(59,130,246,0.15));border:1px solid var(--green);padding:14px;border-radius:14px;margin-bottom:14px}
.earn-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}

.copy-box{display:flex;justify-content:space-between;align-items:center;background:#141414;border:1px solid var(--border);padding:10px;border-radius:10px;margin-top:8px;font-size:12px;word-break:break-all}
.bio-display{
  font-size:13px;
  color:var(--muted);
  margin:8px 0 16px 0;
  line-height:1.4;
  padding:0 20px;
  text-align:center;
  white-space:pre-wrap;
  word-break:break-word;
  min-height:18px;
}
.bio-display:empty{display:none}
</style>
</head>
<body>

<header>
<svg onclick="location.href='index.html'" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
<b id="username">@user</b>
<svg onclick="logout()" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
</header>

<div id="toast" class="toast"></div>

<div class="tiktok-profile">
  <div class="avatar-wrap">
    <div class="avatar"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300ff88'%3E%3Cpath d='M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'/%3E%3Ccircle cx='12' cy='7' r='4'/%3E%3C/svg%3E"></div>
  </div>
  
  <h2 id="username-display" style="font-size:18px;font-weight:800;"></h2>
  <div id="badges" class="badges-wrap"></div>
  <p id="bio-text" class="bio-display"></p>

  <div class="tiktok-stats">
    <div class="tiktok-stat-item">
      <b id="following">0</b>
      <span>Following</span>
    </div>
    <div class="tiktok-stat-item">
      <b id="followers">0</b>
      <span>Followers</span>
    </div>
    <div class="tiktok-stat-item">
      <b id="likes">0</b>
      <span>Likes</span>
    </div>
    <div class="tiktok-stat-item">
      <b id="views">0</b>
      <span>Views</span>
    </div>
  </div>

  <div class="profile-actions">
    <button id="follow-btn" class="btn-pill primary" onclick="toggleFollow()">Follow</button>
    <button id="message-btn" class="btn-pill secondary" onclick="openChat()" style="display:none">Message</button>
  </div>

  <div id="bio-editor" style="display:none;margin-top:14px;">
    <textarea id="bio-input" class="input" style="height:60px;resize:none;" placeholder="Update bio (max 150 chars)..." maxlength="150"></textarea>
    <div style="display:flex;gap:8px;">
      <button class="btn" style="padding:8px;font-size:12px;" onclick="saveBio()">Save Bio</button>
      <button class="btn secondary" style="padding:8px;font-size:12px;" onclick="clearBio()">Clear</button>
    </div>
  </div>

  <div id="links-box" style="display:none;margin-top:14px;text-align:left">
    <b style="font-size:12px;">Referral & Profile Links</b>
    <div class="copy-box">
      <div><div style="font-size:10px;color:var(--muted)">Profile Link</div><span id="profile-link"></span></div>
      <svg onclick="copyLink('profile-link')" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </div>
    <div class="copy-box">
      <div><div style="font-size:10px;color:var(--muted)">Referral Link</div><span id="referral-link"></span></div>
      <svg onclick="copyLink('referral-link')" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('posts',this)">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>Posts
  </div>
  <div class="tab" onclick="showTab('analytics',this)">
    <svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>Analytics
  </div>
  <div class="tab" onclick="showTab('wallet',this)">
    <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01M20 12h-4"/></svg>Wallet
  </div>
  <div class="tab" onclick="showTab('gifts',this)">
    <svg viewBox="0 0 24 24"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>Gifts
  </div>
  <div class="tab" onclick="showTab('support',this)">
    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Support
  </div>
</div>

<div class="content">
  <div id="tab-posts"></div>
  <div id="tab-analytics" style="display:none"></div>
  <div id="tab-wallet" style="display:none"></div>
  <div id="tab-gifts" style="display:none"></div>
  <div id="tab-support" style="display:none"></div>
</div>

<div id="otp-modal" class="modal">
  <div class="glass-modal">
    <h3 style="margin-bottom:12px">Verify Withdrawal</h3>
    <p style="color:var(--muted);font-size:12px;margin-bottom:12px">Enter OTP sent to your registered email</p>
    <input class="input" id="otp-input" placeholder="123456">
    <button class="btn" onclick="confirmWithdraw()">Confirm Withdraw</button>
  </div>
</div>

<script>
const API='https://golviral-api.onrender.com';
const TOKEN=localStorage.token;
if(!TOKEN) location.href='auth.html';
const profileId=new URLSearchParams(location.search).get('id')||localStorage.userId;
const isSelf=profileId===localStorage.userId;
let pendingWithdraw=null;
let followLock=false;

function toast(msg){const t=document.getElementById('toast');t.innerText=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
async function api(path,opt={}){try{const res=await fetch(API+path,{...opt,headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json',...opt.headers}});if(res.status===401)location.href='auth.html';return res.json()}catch{toast('Network error');return {}}}

function getPercent(str){if(!str)return 0;const [a,b]=str.split('/').map(Number);return b ? Math.min(100,Math.round(a/b*100)) : 0}

// LOCATION DETECTOR: Check if user is in Nigeria via Timezone & Browser Settings
function checkIsNigeria() {
  try {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    const lang = navigator.language || "";
    return tz.includes("Lagos") || lang.includes("NG") || lang.includes("ng");
  } catch(e) {
    return false;
  }
}

// EXCHANGE RATE ENGINE via open.er-api.com
async function fetchUSDToNGNRate() {
  try {
    const res = await fetch('https://open.er-api.com/v6/latest/USD');
    const data = await res.json();
    if (data && data.rates && data.rates.NGN) {
      return data.rates.NGN;
    }
  } catch(e) {
    console.warn("Could not fetch open.er-api.com rates, using fallback");
  }
  return 1500;
}

// REAL LOCAL STORAGE DAILY SCORE ENGINE
function getAndSaveDailyScores(uid, currentViews, currentLikes) {
  const key = `golviral_daily_scores_${uid}`;
  let history = [];
  try { history = JSON.parse(localStorage.getItem(key)) || []; } catch(e) { history = []; }

  const todayStr = new Date().toISOString().split('T')[0];
  const dayName = new Date().toLocaleDateString('en-US', { weekday: 'short' });

  const existingIdx = history.findIndex(item => item.date === todayStr);
  if (existingIdx !== -1) {
    history[existingIdx].views = currentViews;
    history[existingIdx].likes = currentLikes;
  } else {
    history.push({ date: todayStr, day: dayName, views: currentViews, likes: currentLikes });
  }

  if (history.length > 7) history = history.slice(-7);
  localStorage.setItem(key, JSON.stringify(history));
  return history;
}

// SVG DYNAMIC LINE AREA CHART GENERATOR
function buildLineAreaChart(data, key, mainColor, gradId) {
  if (!data || data.length === 0) {
    return `<div style="color:var(--muted);font-size:12px;text-align:center;padding:20px;">No daily data tracked yet</div>`;
  }

  const width = 320;
  const height = 110;
  const paddingX = 25;
  const paddingY = 20;
  const usableW = width - (paddingX * 2);
  const usableH = height - (paddingY * 2);

  const values = data.map(d => Number(d[key]) || 0);
  const maxVal = Math.max(...values, 1);
  const minVal = 0;

  const points = values.map((val, idx) => {
    const x = paddingX + (idx / Math.max(values.length - 1, 1)) * usableW;
    const y = (height - paddingY) - ((val - minVal) / Math.max(maxVal - minVal, 1)) * usableH;
    return { x: Math.round(x), y: Math.round(y), val, day: data[idx].day || '' };
  });

  const lineD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
  const areaD = `${lineD} L ${points[points.length - 1].x} ${height - 10} L ${points[0].x} ${height - 10} Z`;

  const nodes = points.map(p => `
    <circle cx="${p.x}" cy="${p.y}" r="4" fill="${mainColor}" stroke="#121212" stroke-width="2"/>
    <text x="${p.x}" y="${height + 5}" font-size="9" font-weight="600" fill="var(--muted)" text-anchor="middle">${p.day}</text>
    <text x="${p.x}" y="${Math.max(p.y - 7, 10)}" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">${p.val}</text>
  `).join('');

  return `
  <svg viewBox="0 0 ${width} ${height + 15}" style="width:100%;height:auto;overflow:visible;">
    <defs>
      <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${mainColor}" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="${mainColor}" stop-opacity="0.0"/>
      </linearGradient>
    </defs>
    <line x1="${paddingX}" y1="${height - 10}" x2="${width - paddingX}" y2="${height - 10}" stroke="var(--border)" stroke-width="1"/>
    <path d="${areaD}" fill="url(#${gradId})"/>
    <path d="${lineD}" fill="none" stroke="${mainColor}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${nodes}
  </svg>`;
}

// LOAD PROFILE
async function loadProfile(){
const u=await api(`/api/user/${profileId}`);
document.getElementById('username').innerText='@'+u.username;
document.getElementById('username-display').innerText=u.username;
document.getElementById('followers').innerText=u.followers||0;
document.getElementById('following').innerText=u.following||0;
document.getElementById('likes').innerText=u.totalLikes||0;
document.getElementById('views').innerText=u.totalViews||0;

getAndSaveDailyScores(profileId, u.totalViews || 0, u.totalLikes || 0);

document.getElementById('bio-text').innerText = u.bio || '';

let badges='';
if(u.isVerified) badges+=`<span class="badge verified"><svg class="icon-inline" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Verified</span>`;
if(u.dmUnlocked) badges+=`<span class="badge creator"><svg class="icon-inline" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Creator</span>`;
document.getElementById('badges').innerHTML=badges;

if(isSelf){
  document.getElementById('links-box').style.display='block';
  document.getElementById('profile-link').innerText=u.profileLink;
  document.getElementById('referral-link').innerText=u.referralLink;
  document.querySelector('.profile-actions').style.display='none';
  document.getElementById('bio-editor').style.display='block';
  document.getElementById('bio-input').value = u.bio || '';
  loadKYCStatus();
}else{
  document.getElementById('follow-btn').innerText=u.isFollowing ? 'Unfollow' : 'Follow';
  const msgBtn = document.getElementById('message-btn');
  msgBtn.style.display = 'inline-flex';
  if(u.dmUnlocked || u.isVerified){
    msgBtn.innerText = 'Message';
    msgBtn.onclick = () => openChat(profileId);
  } else {
    msgBtn.innerText = 'Unlock DM';
    msgBtn.onclick = async () => {
      const d = await api('/api/dm/init',{method:'POST'});
      if(d.selarLink) window.open(d.selarLink);
    }
  }
}
loadPosts();
}

function copyLink(id){
  navigator.clipboard.writeText(document.getElementById(id).innerText);
  toast('Copied to clipboard');
}

async function loadPosts(){
const d=await api(`/api/user/${profileId}/posts`);
document.getElementById('tab-posts').innerHTML=`<div class="grid">${(d||[]).map(()=>`<div class="grid-item"></div>`).join('')}</div>`;
}

function showTab(tab,el){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
document.querySelectorAll('[id^=tab-]').forEach(d=>d.style.display='none');
document.getElementById('tab-'+tab).style.display='block';
if(tab==='analytics')loadAnalytics();
if(tab==='wallet')loadWallet();
if(tab==='gifts')loadGifts();
if(tab==='support')loadSupport();
}

// SEPARATE LIKES & VIEWS LINE AREA CHARTS + DYNAMIC OPEN.ER-API EARNINGS
async function loadAnalytics(){
  const u = await api(`/api/user/${profileId}`);
  const dailyScores = getAndSaveDailyScores(profileId, u.totalViews || 0, u.totalLikes || 0);
  const w = await api('/api/wallet');

  const usdToNgnRate = await fetchUSDToNGNRate();
  const isNigeria = checkIsNigeria();

  const rawNairaBalance = w.cashBalance || 0;
  const usdtValue = (rawNairaBalance / usdToNgnRate).toFixed(2);
  const formattedNaira = rawNairaBalance.toLocaleString();

  let likesTrend = 'up';
  if (dailyScores.length > 1) {
    const prevLikes = dailyScores[dailyScores.length - 2].likes || 0;
    const currLikes = dailyScores[dailyScores.length - 1].likes || 0;
    likesTrend = currLikes >= prevLikes ? 'up' : 'down';
  }

  let viewsTrend = 'up';
  if (dailyScores.length > 1) {
    const prevViews = dailyScores[dailyScores.length - 2].views || 0;
    const currViews = dailyScores[dailyScores.length - 1].views || 0;
    viewsTrend = currViews >= prevViews ? 'up' : 'down';
  }

  const likesChartSvg = buildLineAreaChart(dailyScores, 'likes', '#ec4899', 'likesGradient');
  const viewsChartSvg = buildLineAreaChart(dailyScores, 'views', '#00ff88', 'viewsGradient');

  let earningsDisplayHTML = '';
  if (isNigeria) {
    earningsDisplayHTML = `
      <div class="earn-row">
        <span>Naira Earned:</span>
        <b style="color:var(--green);font-size:16px;">₦${formattedNaira}</b>
      </div>
      <div class="earn-row">
        <span>US Dollar ($) Equivalent:</span>
        <b style="color:var(--blue);font-size:16px;">$${usdtValue} USDT</b>
      </div>
      <p style="font-size:10px;color:var(--muted);margin-top:6px;text-align:right;">Auto-rate: 1 USD = ₦${usdToNgnRate.toFixed(2)} </p>
    `;
  } else {
    earningsDisplayHTML = `
      <div class="earn-row">
        <span>Total Earned:</span>
        <b style="color:var(--green);font-size:18px;">$${usdtValue} USDT</b>
      </div>
      <p style="font-size:10px;color:var(--muted);margin-top:6px;text-align:right;">Calculated via open.er-api.com</p>
    `;
  }

  document.getElementById('tab-analytics').innerHTML = `
  <div class="earn-badge">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <b style="font-size:13px;color:var(--text)">💰 Auto Estimated Cash Earnings</b>
      <span style="font-size:10px;background:rgba(0,255,136,0.2);color:var(--green);padding:2px 6px;border-radius:6px;font-weight:700">LIVE</span>
    </div>
    ${earningsDisplayHTML}
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <h4 style="font-size:15px;color:var(--pink);">Daily Likes Analytics 💖</h4>
        <p style="font-size:11px;color:var(--muted);">Tracked via real user engagement</p>
      </div>
      <span class="trend-pill ${likesTrend === 'up' ? 'trend-up' : 'trend-down'}">

function toggleWithdrawFields(){
  const method = document.getElementById('withdraw-method').value;
  document.getElementById('bank-fields').style.display = method==='BANK' ? 'block' : 'none';
  document.getElementById('usdt-fields').style.display = method==='USDT' ? 'block' : 'none';
}

async function deposit(amount){const d=await api('/api/deposit/init',{method:'POST',body:JSON.stringify({tierAmount:amount})});if(d.selarLink)window.open(d.selarLink)}
async function unlockDM(){const d=await api('/api/dm/init',{method:'POST'});if(d.selarLink)window.open(d.selarLink)}

async function requestWithdraw(){
const amount=document.getElementById('withdraw-amount').value;
const method=document.getElementById('withdraw-method').value;
if(Number(amount) < 50000) return toast('Min withdrawal is 50,000 pts');
let targetDetails = {};
if(method==='BANK'){
  const bankName=document.getElementById('bank-name').value;
  const accountNumber=document.getElementById('account-number').value;
  const accountName=document.getElementById('account-name').value;
  if(!bankName || !accountNumber || !accountName) return toast('Fill all bank details');
  targetDetails = {bankName, accountNumber, accountName};
}else{
  const usdt=document.getElementById('usdt-address').value;
  if(!usdt) return toast('Enter TRC20 Address');
  if(Number(amount)!==120000 && Number(amount)!==12000000) return toast('USDT only 120k or 12M pts');
  targetDetails = usdt;
}
pendingWithdraw={amountPoints:Number(amount),method,targetDetails};
const res=await api('/api/wallet/withdraw',{method:'POST',body:JSON.stringify(pendingWithdraw)});
if(res.authChallenge)document.getElementById('otp-modal').classList.add('active');
else if(res.error) toast(res.error);
}

async function confirmWithdraw(){
const otpVal=document.getElementById('otp-input').value;
const res=await api('/api/wallet/withdraw/confirm',{method:'POST',body:JSON.stringify({...pendingWithdraw,otp:otpVal})});
if(res.transactionAcknowledged){toast('Withdraw Requested');loadWallet()}
else toast(res.error || 'Failed');
document.getElementById('otp-modal').classList.remove('active');
}

async function loadKYCStatus() {

async function saveBio() {
  const bio = document.getElementById('bio-input').value;
  const res = await api('/api/profile/bio', { method: 'POST', body: JSON.stringify({ bio }) });
  if (res.success) {
    toast('Bio updated');
    document.getElementById('bio-text').innerText = res.bio;
  } else toast(res.error || 'Failed');
}

async function clearBio() {
  const res = await api('/api/profile/bio', { method: 'DELETE' });
  if (res.success) {
    toast('Bio cleared');
    document.getElementById('bio-input').value = '';
    document.getElementById('bio-text').innerText = '';
  }
}


function openKYCPortal() {
  const kycUrl = `kyc.html?token=${encodeURIComponent(TOKEN)}&api=${encodeURIComponent(API)}`;
  const kycWin = window.open(kycUrl, "_blank");
  if (!kycWin) return toast("Please allow popups to open KYC window");
}
