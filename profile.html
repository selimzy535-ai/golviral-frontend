<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="0rn74joHgCCJ0qqgQmbX4H9k1VRvOH31qY_SDkGqLbE" />
<title>GolViral - Creator Profile</title>
<meta name="description" content="View creator profile on GolViral.">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<style>
:root{--bg:#000;--card:#0d0d0d;--glass:rgba(15,15,15,0.75);--text:#fff;--muted:#777;--border:#1e1e1e;--green:#00ff88;--purple:#a855f7;--pink:#ec4899;--blue:#3b82f6;--orange:#f97316;--red:#ef4444;--gradient:linear-gradient(135deg,#00ff88,#3b82f6,#a855f7)}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);max-width:500px;margin:0 auto;min-height:100dvh;padding-bottom:30px}
header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;cursor:pointer}
.tiktok-profile{padding:20px 16px;text-align:center;background:radial-gradient(circle at 50% 0%,rgba(0,255,136,0.08),transparent 65%)}
.avatar-wrap{position:relative;width:96px;height:96px;margin:0 auto 12px}
.avatar{width:100%;height:100%;border-radius:50%;background:var(--gradient);padding:3px;box-shadow:0 0 25px rgba(0,255,136,0.25)}
.avatar img{width:100%;height:100%;border-radius:50%;background:var(--card);object-fit:cover}
.badges-wrap{display:flex;justify-content:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700}
.badge.verified{background:rgba(59,130,246,0.15);color:var(--blue);border:1px solid rgba(59,130,246,0.3)}
.badge.creator{background:rgba(168,85,247,0.15);color:var(--purple);border:1px solid rgba(168,85,247,0.3)}
.badge.kyc{background:rgba(0,255,136,0.15);color:var(--green);border:1px solid rgba(0,255,136,0.3)}
.tiktok-stats{display:flex;justify-content:center;gap:24px;margin:16px 0;padding:10px 0}
.tiktok-stat-item{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.tiktok-stat-item b{font-size:18px;font-weight:800}
.tiktok-stat-item span{font-size:12px;color:var(--muted);margin-top:2px}
.profile-actions{display:flex;justify-content:center;gap:10px;margin-top:14px}
.btn-pill{padding:9px 20px;border-radius:24px;font-weight:700;font-size:14px;border:none;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn-pill.primary{background:var(--gradient);color:#000}
.btn-pill.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg);overflow-x:auto}
.tab{flex:1;padding:12px 0;color:var(--muted);cursor:pointer;display:flex;justify-content:center;align-items:center;gap:6px;font-weight:700;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap;min-width:70px}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin:16px}
.input{width:100%;background:#141414;border:1px solid var(--border);color:var(--text);padding:12px;border-radius:12px;margin-bottom:10px;outline:none}
.btn{background:var(--gradient);color:#000;border:none;padding:12px;border-radius:12px;font-weight:800;width:100%;cursor:pointer}
.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:16px}
.grid-item{aspect-ratio:9/16;background:#000;border-radius:8px;border:1px solid var(--border);position:relative;overflow:hidden;cursor:pointer}
.grid-item video,.grid-item img{width:100%;height:100%;object-fit:cover}
.grid-overlay{position:absolute;bottom:0;left:0;right:0;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,0.75));display:flex;gap:4px;color:#fff;font-size:11px;font-weight:700}
.chart-box{margin-top:12px;background:#121212;border:1px solid var(--border);border-radius:14px;padding:14px}
.trend-pill{display:inline-flex;gap:4px;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700}
.trend-up{background:rgba(0,255,136,0.15);color:var(--green)}
.trend-down{background:rgba(239,68,68,0.15);color:var(--red)}
.earn-badge{background:linear-gradient(135deg,rgba(0,255,136,0.15),rgba(59,130,246,0.15));border:1px solid var(--green);padding:14px;border-radius:14px;margin:16px}
.earn-row{display:flex;justify-content:space-between;margin-top:8px}
.bio-display{font-size:13px;color:var(--muted);margin:8px 0 16px;text-align:center;white-space:pre-wrap;word-break:break-word}
.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-100px);background:var(--green);color:#000;padding:10px 20px;border-radius:20px;font-weight:800;z-index:999;transition:0.3s;opacity:0}
.toast.show{transform:translate(-50%,0);opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;justify-content:center;align-items:center;z-index:200;padding:16px}
.modal.active{display:flex}
.glass-modal{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;width:90%;max-width:400px}
.user-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
</style>
</head>
<body>
<header>
<svg onclick="location.href='index.html'" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
<b id="username">@user</b>
<svg onclick="logout()" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
</header>
<div id="toast" class="toast"></div>

<div class="tiktok-profile">
  <div class="avatar-wrap"><div class="avatar"><img id="avatar-img" src="/icon-192.png"></div></div>
  <h2 id="displayName" style="font-size:20px;font-weight:800">Loading...</h2>
  <div id="badges" class="badges-wrap"></div>
  <p id="bio" class="bio-display"></p>
  <div class="tiktok-stats">
    <div class="tiktok-stat-item" onclick="switchTab('posts')"><b id="postCount">0</b><span>Posts</span></div>
    <div class="tiktok-stat-item" onclick="switchTab('followers')"><b id="followerCount">0</b><span>Followers</span></div>
    <div class="tiktok-stat-item" onclick="switchTab('following')"><b id="followingCount">0</b><span>Following</span></div>
    <div class="tiktok-stat-item"><b id="likeCount">0</b><span>Likes</span></div>
  </div>
  <div class="profile-actions">
    <button class="btn-pill primary" id="followBtn" onclick="toggleFollow()">Follow</button>
    <button class="btn-pill secondary" onclick="switchTab('chat')">Message</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="posts" onclick="switchTab('posts')">Posts</div>
  <div class="tab" data-tab="likes" onclick="switchTab('likes')">Likes</div>
  <div class="tab" data-tab="analytics" onclick="switchTab('analytics')">Analytics</div>
  <div class="tab" data-tab="wallet" onclick="switchTab('wallet')">Wallet</div>
  <div class="tab" data-tab="support" onclick="switchTab('support')">Support</div>
</div>

<div id="tab-posts"><div class="grid" id="grid"><p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:20px">Loading...</p></div></div>
<div id="tab-likes" style="display:none;padding:16px"></div>
<div id="tab-analytics" style="display:none"></div>
<div id="tab-wallet" style="display:none"></div>
<div id="tab-support" style="display:none"></div>

<script>
const API=''; // your backend base
const profileId=new URLSearchParams(location.search).get('id') || localStorage.getItem('userId');
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(p,o={}){const token=localStorage.getItem('token');o.headers={...(o.headers||{}),'Content-Type':'application/json',Authorization:`Bearer ${token}`};const r=await fetch(p,o);return r.json().catch(()=>({}))}
function logout(){localStorage.clear();location.href='/login.html'}
function switchTab(t){document.querySelectorAll('[id^="tab-"]').forEach(e=>e.style.display='none');document.getElementById('tab-'+t).style.display='block';document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));document.querySelector(`.tab[data-tab="${t}"]`)?.classList.add('active');if(t==='posts')loadPosts();if(t==='analytics')loadAnalytics();if(t==='wallet')loadWallet();if(t==='support')loadSupport()}

// OLD 3x3 POSTS - kept as is
async function loadPosts(){
  const posts=await api(`/api/posts/user/${profileId}`);
  document.getElementById('grid').innerHTML=(posts||[]).length?(posts||[]).map(p=>`
    <div class="grid-item" onclick="location.href='/reel.html?id=${p._id}'">
      ${p.videoUrl?`<video src="${p.videoUrl}" muted></video>`:`<img src="${p.imageUrl||'/icon-192.png'}">`}
      <div class="grid-overlay">▶ ${p.views||0}</div>
    </div>`).join(''):`<p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:20px">No posts yet</p>`;
}

// OLD ANALYTICS with chart-box - kept as is
function buildLineAreaChart(data,color){
  if(!data||!data.length) return '<p style="color:var(--muted);font-size:12px">No data yet</p>';
  const max=Math.max(...data.map(d=>d.v),1);
  const w=300,h=60; const step=w/(data.length-1||1);
  let points=data.map((d,i)=>`${i*step},${h-(d.v/max)*h}`).join(' ');
  let area=`0,${h} ${points} ${w},${h}`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="60"><polygon fill="${color}22" points="${area}"/><polyline fill="none" stroke="${color}" stroke-width="2" points="${points}"/></svg>`;
}
async function loadAnalytics(){
  const u=await api(`/api/user/${profileId}`);
  const scores=JSON.parse(localStorage.getItem('dailyScores_'+profileId)||'[]');
  const likeData=scores.map(s=>({v:s.likes})); const viewData=scores.map(s=>({v:s.views}));
  document.getElementById('tab-analytics').innerHTML=`
    <div class="card"><b>Followers Growth</b><div class="chart-box">${buildLineAreaChart(likeData,'#a855f7')}<p style="font-size:11px;color:var(--muted);margin-top:6px">Total: ${u.totalLikes||0} likes • ${u.totalViews||0} views</p></div></div>
    <div class="card"><b>Views Trend</b><div class="chart-box">${buildLineAreaChart(viewData,'#00ff88')}</div></div>
    <div class="earn-badge"><div class="earn-row"><span>Posts</span><b>${u.posts||0}</b></div><div class="earn-row"><span>Followers</span><b>${u.followers||0}</b></div><div class="earn-row"><span>Following</span><b>${u.following||0}</b></div></div>`;
}

// OLD WALLET but DAILY CAP REMOVED
async function loadWallet(){
  const w=await api('/api/wallet');
  document.getElementById('tab-wallet').innerHTML=`
    <div class="earn-badge">
      <b style="font-size:16px">₦${(w.cashBalance||0).toLocaleString()}</b><br><span style="font-size:12px;color:var(--muted)">Cash Balance</span>
      <div class="earn-row"><span>Coin Balance</span><b>${w.coinBalance||0}</b></div>
      <div class="earn-row"><span>Total Earned</span><b>₦${(w.totalEarned||0).toLocaleString()}</b></div>
    </div>
    <div class="card"><b>Withdraw</b><input class="input" id="w-amount" placeholder="Amount"><button class="btn" onclick="withdraw()">Withdraw</button></div>`;
}
async function withdraw(){ const a=document.getElementById('w-amount').value; if(!a) return toast('Enter amount'); const r=await api('/api/wallet/withdraw',{method:'POST',body:JSON.stringify({amount:Number(a)})}); if(r.error) toast(r.error); else toast('Requested'); }

// SUPPORT - fixed with GOLVIRAL SUPPORT TEAM
async function loadSupport(){
  document.getElementById('tab-support').innerHTML=`
    <div class="card">
      <b>Contact Support</b>
      <input class="input" id="support-subject" placeholder="Subject" style="margin-top:10px">
      <textarea class="input" id="support-msg" placeholder="Describe your issue..." rows="4"></textarea>
      <button class="btn" onclick="sendSupport()">Send Ticket</button>
    </div>
    <div style="padding:0 16px"><b style="font-size:13px;color:var(--muted)">YOUR TICKETS</b></div>
    <div id="tickets"><p style="text-align:center;color:var(--muted);padding:20px">Loading...</p></div>`;
  const t=await api('/api/support/my');
  const html = (t||[]).length? (t||[]).map(x=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between"><b>${escapeHtml(x.subject)}</b><span style="font-size:10px;padding:3px 8px;border-radius:10px;font-weight:800;background:${x.status==='RESOLVED'?'rgba(0,255,136,0.15)':'rgba(249,115,22,0.15)'};color:${x.status==='RESOLVED'?'var(--green)':'var(--orange)'}">${escapeHtml(x.status)}</span></div>
      <div style="margin-top:12px;background:#141414;border:1px solid var(--border);border-radius:12px;padding:10px">
        <p style="color:var(--muted);font-size:11px;font-weight:700;margin-bottom:4px">YOU • ${new Date(x.createdAt).toLocaleDateString()}</p>
        <p style="font-size:13px">${escapeHtml(x.message)}</p>
      </div>
      ${x.reply? `<div style="margin-top:10px;background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.2);border-radius:12px;padding:10px"><p style="color:var(--green);font-size:11px;font-weight:700">GOLVIRAL SUPPORT TEAM</p><p style="font-size:13px">${escapeHtml(x.reply)}</p></div>` : `<p style="color:var(--muted);font-size:11px;margin-top:10px;font-style:italic">Support team hasn't replied yet</p>`}
    </div>`).join('') : `<p style="text-align:center;color:var(--muted);padding:20px">No tickets yet</p>`;
  document.getElementById('tickets').innerHTML = html;
}
async function sendSupport(){
  const subject=document.getElementById('support-subject').value.trim();
  const message=document.getElementById('support-msg').value.trim();
  if(!subject||!message) return toast('Fill all fields');
  const res=await api('/api/support/send',{method:'POST',body:JSON.stringify({subject,message})});
  if(res.error) return toast(res.error);
  toast('Ticket sent'); loadSupport();
}

// init
(async function init(){
  const u=await api(`/api/user/${profileId}`);
  document.getElementById('displayName').textContent=u.username||'@user';
  document.getElementById('username').textContent='@'+(u.username||'user');
  document.getElementById('postCount').textContent=u.posts||0;
  document.getElementById('followerCount').textContent=u.followers||0;
  document.getElementById('followingCount').textContent=u.following||0;
  document.getElementById('likeCount').textContent=u.totalLikes||0;
  document.getElementById('bio').textContent=u.bio||'';
  if(u.avatar) document.getElementById('avatar-img').src=u.avatar;
  loadPosts();
})();
function toggleFollow(){toast('Follow logic here')}
</script>
</body>
</html>
