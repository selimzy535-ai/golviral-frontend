<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GolViral - Create</title>
<style>
:root{--bg:#000;--card:#0d0d0d;--text:#fff;--muted:#777;--border:#1e1e1e;--gradient:linear-gradient(135deg,#00ff88,#3b82f6,#a855f7)}
*{box-sizing:border-box;font-family:system-ui} body{background:var(--bg);color:var(--text);padding:16px;max-width:500px;margin:0 auto}
.input,textarea,select{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:12px;margin-bottom:12px}
.btn{background:var(--gradient);color:#000;border:none;padding:14px;border-radius:12px;font-weight:800;width:100%;cursor:pointer}
.preview{width:100%;border-radius:12px;margin-bottom:12px;max-height:400px;object-fit:cover}
.progress{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:12px}
.bar{height:100%;width:0%;background:var(--gradient);transition:width 0.2s}
</style>
</head>
<body>

<h2>Create Post</h2>
<select id="type" onchange="toggleFile()">
  <option value="reel">Reel - Video</option>
  <option value="photo">Photo - Store</option>
  <option value="story">Story - Image</option>
  <option value="shortstory">Short Story - Text</option>
</select>

<input class="input" id="title" placeholder="Title">
<textarea id="content" placeholder="Write something..." rows="5"></textarea>

<input type="file" id="file" accept="video/*,image/*" style="display:none" onchange="previewFile(event)">
<button class="btn" onclick="document.getElementById('file').click()" id="fileBtn">Select File</button>
<img id="preview" class="preview" style="display:none">
<div class="progress"><div class="bar" id="bar"></div></div>

<button class="btn" onclick="upload()">Post</button>

<script>
const API='https://golviral-api.onrender.com';
const TOKEN=localStorage.token;
let selectedFile=null;

function toggleFile(){
  const t=document.getElementById('type').value;
  document.getElementById('fileBtn').style.display = (t==='shortstory')?'none':'block';
}

function previewFile(e){
  selectedFile=e.target.files[0];
  if(!selectedFile) return;
  if(selectedFile.type.startsWith('image')){
    document.getElementById('preview').src=URL.createObjectURL(selectedFile);
    document.getElementById('preview').style.display='block';
  }
}

async function api(path,body){
  const res=await fetch(API+path,{method:'POST',headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(res.status===401) location.href='auth.html';
  return res.json();
}

// STEP 1: Get presigned URL
// STEP 2: Upload direct to B2
// STEP 3: Create post
async function upload(){
  const type=document.getElementById('type').value;
  const title=document.getElementById('title').value;
  const content=document.getElementById('content').value;

  // 1. CREATE INTENT
  const intent=await api('/api/post/create-intent',{
    postType:type,
    contentType:selectedFile?.type,
    fileExtension:selectedFile?.name.split('.').pop()
  });
  if(intent.error) return alert(intent.error);

  // 2. UPLOAD TO B2 DIRECT
  if(intent.uploadUrl && selectedFile){
    await uploadToB2(intent.uploadUrl, selectedFile);
  }

  // 3. FINALIZE POST
  const final=await api('/api/post/create',{
    postId:intent.postId,
    objectKey:intent.objectKey,
    title,
    content
  });
  if(final.error) return alert(final.error);
  alert('Posted!');
  location.href='index.html';
}

function uploadToB2(url,file){
  return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();
    xhr.open('PUT',url);
    xhr.setRequestHeader('Content-Type',file.type);
    xhr.upload.onprogress=e=>{
      if(e.lengthComputable) document.getElementById('bar').style.width=(e.loaded/e.total*100)+'%';
    }
    xhr.onload=()=> xhr.status===200?resolve():reject();
    xhr.onerror=reject;
    xhr.send(file);
  })
}
</script>
</body>
</html>
