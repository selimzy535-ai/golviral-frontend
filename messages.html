<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GolViral - Messages</title>
<link rel="manifest" href="/manifest.json">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
:root{ --bg:#000;--card:#0d0d0d;--glass:rgba(15,15,15,0.65);--text:#fff;--muted:#777;--border:#1e1e1e; --gradient:linear-gradient(135deg,#00ff88,#3b82f6,#a855f7) }
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);max-width:500px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
body::before{content:'';position:absolute;inset:0;z-index:-1;background-image:var(--chat-bg,none);background-size:cover;background-position:center;filter:brightness(0.35) blur(2px);transition:background-image 0.3s}
header{padding:16px;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;z-index:2;justify-content:space-between}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;cursor:pointer}
.list{flex:1;overflow-y:auto;z-index:2}
.chat-item{display:flex;gap:12px;padding:16px;border-bottom:1px solid var(--border);cursor:pointer}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;position:relative}
.chat-header{padding:16px;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;z-index:2;justify-content:space-between}
.last-seen{font-size:11px;color:var(--muted)}
.chat-box{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;z-index:2;overflow-x:hidden}
.bubble{max-width:78%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.4;position:relative;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap}
.sent{align-self:flex-end;background:var(--gradient);color:#000;border-bottom-right-radius:4px}
.recv{align-self:flex-start;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--border);border-bottom-left-radius:4px}
.bubble a{color:#3b82f6;text-decoration:underline;word-break:break-all}
.sent a{color:#000;font-weight:700;text-decoration:underline}
.recv a{color:#60a5fa}
.bubble-time{font-size:10px;color:var(--muted);margin-top:4px;text-align:right}
.sent.bubble-time{color:rgba(0,0,0,0.6)}
.input-area{padding:8px 12px;background:var(--glass);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;z-index:2}
.input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:22px;outline:none}
.send-btn{background:var(--gradient);border:none;border-radius:50%;width:44px;height:44px;display:flex;justify-content:center;align-items:center;cursor:pointer}
.typing{display:flex;gap:4px;padding:8px 16px}.dot{width:8px;height:8px;background:var(--muted);border-radius:50%;animation:blink 1.4s infinite}
@keyframes blink{0%,60%,100%{opacity:0.3}30%{opacity:1}}
.error-modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);display:none;justify-content:center;align-items:center;z-index:200}
.error-box{background:var(--card);border:1px solid var(--border);padding:20px;border-radius:16px;text-align:center}
.btn{background:var(--gradient);color:#000;border:none;padding:12px;border-radius:12px;font-weight:800;width:100%;cursor:pointer}
.bg-btn-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.bg-label{font-size:10px;color:var(--muted)}
</style>
</head>
<body>
<div id="chat-list-screen">
<header><svg onclick="location.href='index.html'" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><h3>Messages</h3></header>
<div class="list" id="chat-list">Loading...</div>
</div>
<div id="chat-screen" style="display:none;flex-direction:column;height:100dvh">
<header class="chat-header">
<div style="display:flex;align-items:center;gap:12px">
<svg onclick="backToList()" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
<div class="avatar" id="chat-avatar"><span id="chat-initial"></span></div>
<div><b id="chat-name"></b><div class="last-seen" id="last-seen"></div></div>
</div>
<div class="bg-btn-wrap">
<svg onclick="changeBackground()" viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4.2 2.1 7.8L12 17l-6.6 4 2.1-7.8L2 9h7l3-7z"/></svg>
<div class="bg-label">Edit BG</div>
</div>
</header>
<div class="chat-box" id="chat-box"></div>
<div id="typing-indicator" class="typing" style="display:none"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
<div class="input-area">
<input class="input" id="msg-input" placeholder="Message..." onkeydown="handleTyping(event)">
<button class="send-btn" onclick="sendMessage()"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
</div>
</div>
<div id="dm-error" class="error-modal"><div class="error-box"><p id="dm-error-text">DM Locked</p><button class="btn" onclick="closeError()">OK</button></div></div>
<input type="file" id="bg-upload" accept="image/*" style="display:none" onchange="handleBgUpload(event)">
<script>
const API='https://golviral-api.onrender.com';
const TOKEN=localStorage.token;
const MY_USER_ID=localStorage.userId;
if(!TOKEN ||!MY_USER_ID) location.href='auth.html';
const params=new URLSearchParams(location.search);
const toUserId=params.get('user') || params.get('to');
let socket=null;
let currentChat=null;
let lastTyping=0;

function escapeHtml(s){
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function linkify(text){
  const escaped = escapeHtml(text);
  const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+)/gi;
  return escaped.replace(urlRegex, (url)=>{
    let href = url;
    if(!href.startsWith('http')) href = 'https://' + href;
    try{
      const u = new URL(href);
      if(!['http:','https:'].includes(u.protocol)) return url;
    }catch{ return url; }
    return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${escapeHtml(url)}</a>`;
  });
}
function showScreen(s){
  document.getElementById('chat-list-screen').style.display=s==='list'?'block':'none';
  document.getElementById('chat-screen').style.display=s==='chat'?'flex':'none';
}
async function api(path,opt={}){
  const res=await fetch(API+path,{...opt,headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json',...opt.headers}});
  if(res.status===401) location.href='auth.html';
  return res.json();
}
function initSocket(){
  if(socket) try{socket.disconnect();}catch{}
  socket=io(API,{auth:{token:TOKEN},reconnection:true,reconnectionAttempts:10,reconnectionDelay:1000});
  socket.on('connect',()=>console.log('[WS] Connected'));
  socket.on('disconnect',()=>console.log('[WS] Disconnected'));
  socket.on('receive_message',data=>{
    if(data.senderId===currentChat || data.receiverId===currentChat) addBubble(data);
  });
  socket.on('typing',data=>{if(data.from===currentChat) showTyping()});
  socket.on('error_msg', data => {
    document.getElementById('dm-error-text').innerText = data.error||'DM Locked';
    showError();
  });
}
async function loadChatList(){
  const res=await api('/api/messages');
  const chats=res.chats||[];
  const listEl=document.getElementById('chat-list');
  if(chats.length===0){
    listEl.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted)">No messages yet</div>';
    return;
  }
  listEl.innerHTML=chats.map(c=>{
    const username=escapeHtml(c.username||'User');
    const initial=username[0].toUpperCase();
    return `<div class="chat-item" data-uid="${escapeHtml(c.userId)}" data-name="${username}"><div class="avatar">${initial}</div><div style="flex:1"><b>${username}</b><br><small style="color:var(--muted)">${escapeHtml(c.lastMessage||'No messages yet').slice(0,60)}</small></div></div>`;
  }).join('');
  listEl.querySelectorAll('.chat-item').forEach(el=>{
    el.addEventListener('click',()=> openChat(el.dataset.uid, el.dataset.name));
  });
}
async function openChat(userId,username){
  currentChat=userId;
  document.getElementById('chat-name').innerText=username||'User';
  document.getElementById('chat-initial').innerText=(username||'U')[0].toUpperCase();
  showScreen('chat');
  const bg = localStorage.getItem(`bg_${userId}`);
  document.body.style.setProperty('--chat-bg', bg? `url(${bg})` : 'none');
  const d=await api(`/api/messages/${userId}`);
  const box=document.getElementById('chat-box');
  box.innerHTML='';
  (d||[]).forEach(m=>addBubble(m));
}
function backToList(){
  showScreen('list');
  currentChat=null;
  document.body.style.setProperty('--chat-bg','none');
  loadChatList();
}
async function sendMessage(){
  const input=document.getElementById('msg-input');
  const text=input.value.trim();
  if(!text ||!currentChat) return;
  if(text.length>1000){ toast('Message too long'); return; }
  input.value='';
  addBubble({text,senderId:MY_USER_ID,receiverId:currentChat,createdAt:new Date()});
  if(socket) socket.emit('send_message',{receiverId:currentChat,text});
}
function handleTyping(e){
  if(e && e.key==='Enter'){ sendMessage(); return; }
  if(Date.now()-lastTyping < 1200) return;
  lastTyping=Date.now();
  if(socket && currentChat) socket.emit('typing',{receiverId:currentChat});
}
function showTyping(){
  const el=document.getElementById('typing-indicator');
  el.style.display='flex';
  setTimeout(()=>el.style.display='none',2000);
}
function addBubble(msg){
  const box=document.getElementById('chat-box');
  const div=document.createElement('div');
  div.className='bubble '+(msg.senderId===MY_USER_ID?'sent':'recv');
  const time=new Date(msg.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const safeText=linkify(msg.text||'');
  div.innerHTML = `<span>${safeText}</span><div class="bubble-time">${time}</div>`;
  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
}
function changeBackground(){ document.getElementById('bg-upload').click(); }
function handleBgUpload(e){
  const file=e.target.files[0];
  if(!file) return;
  if(file.size>5*1024*1024){ toast('Max 5MB'); return; }
  const img=new Image();
  const reader=new FileReader();
  reader.onload=ev=>{
    img.src=ev.target.result;
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const max=800;
      let w=img.width, h=img.height;
      if(w>max || h>max){
        const r=Math.min(max/w, max/h);
        w*=r; h*=r;
      }
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const compressed=canvas.toDataURL('image/jpeg',0.6);
      try{
        localStorage.setItem(`bg_${currentChat}`, compressed);
        document.body.style.setProperty('--chat-bg',`url(${compressed})`);
        toast('Background updated');
      }catch{
        toast('Storage full - use smaller image');
      }
    };
  };
  reader.readAsDataURL(file);
  e.target.value='';
}
function toast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(10px);padding:10px 16px;border-radius:12px;border:1px solid var(--border);z-index:300';
  t.innerText=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}
function showError(){document.getElementById('dm-error').style.display='flex'}
function closeError(){document.getElementById('dm-error').style.display='none'}
initSocket();
if(toUserId){
  openChat(toUserId, localStorage.getItem(`name_${toUserId}`) || 'User');
} else {
  loadChatList();
  showScreen('list');
}
</script>
</body>
</html>
