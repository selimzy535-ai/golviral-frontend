<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>GolViral - Messages</title>
<link rel="manifest" href="/manifest.json">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{ --bg:#000;--card:#0d0d0d;--glass:rgba(15,15,15,0.65);--text:#fff;--muted:#777;--border:#1e1e1e; --gradient:linear-gradient(135deg,#00ff88,#3b82f6,#a855f7) }
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);max-width:500px;margin:0 auto;height:100dvh;height:100svh;display:flex;flex-direction:column;position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;padding-top:env(safe-area-inset-top)}
body::before{content:'';position:absolute;inset:0;z-index:-1;background-image:var(--chat-bg,none);background-size:cover;background-position:center;filter:brightness(0.35) blur(2px);transition:background-image 0.3s}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 16px 16px;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;z-index:2;justify-content:space-between;flex-shrink:0}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;cursor:pointer}
.back-btn{width:48px;height:48px;min-width:48px;border-radius:50%;background:rgba(255,255,255,0.12);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.back-btn svg{width:28px;height:28px;stroke:#fff;stroke-width:2.6}
.list{flex:1;overflow-y:auto;z-index:2}
.chat-item{display:flex;gap:12px;padding:16px;border-bottom:1px solid var(--border);cursor:pointer}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;position:relative;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.chat-header{padding:calc(14px + env(safe-area-inset-top)) 16px 14px 12px;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;z-index:2;justify-content:space-between}
.last-seen{font-size:11px;color:var(--muted)}
.online-dot{position:absolute;bottom:2px;right:2px;width:12px;height:12px;background:#00ff88;border:2px solid #000;border-radius:50%}
.chat-box{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;z-index:2;overflow-x:hidden;user-select:text;-webkit-user-select:text}
.bubble{max-width:78%;min-width:0;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.4;position:relative;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap;user-select:text;-webkit-user-select:text;cursor:text}
.bubble span.bubble-text{display:block;user-select:text;-webkit-user-select:text;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap;min-width:0}
.sent{align-self:flex-end;background:var(--gradient);color:#000;border-bottom-right-radius:4px}
.recv{align-self:flex-start;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--border);border-bottom-left-radius:4px}
.bubble a{color:#3b82f6;text-decoration:underline;word-break:break-all;overflow-wrap:anywhere}
.sent a{color:#000;font-weight:700;text-decoration:underline}
.recv a{color:#60a5fa}
.bubble-time{font-size:10px;color:var(--muted);margin-top:4px;text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:4px;user-select:none;-webkit-user-select:none}
.sent .bubble-time{color:rgba(0,0,0,0.6)}
.bubble img{width:100%;border-radius:12px;display:block;margin-bottom:6px;user-select:none;-webkit-user-select:none}
.bubble-actions{display:flex;justify-content:flex-end;margin-top:6px}
.copy-btn{background:rgba(0,0,0,0.15);border:1px solid rgba(255,255,255,0.15);border-radius:999px;width:28px;height:28px;min-width:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.copy-btn svg{width:14px;height:14px;stroke:#fff}
.sent .copy-btn{background:rgba(0,0,0,0.18);border-color:rgba(0,0,0,0.15)}
.sent .copy-btn svg{stroke:#000}
.recv .copy-btn{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.15)}
.recv .copy-btn svg{stroke:#fff}
.input-area{padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;z-index:10;flex-shrink:0;position:sticky;bottom:0;left:0;right:0}
.input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);padding:14px 16px;border-radius:26px;outline:none;font-size:16px;min-height:52px}
.send-btn{background:var(--gradient);border:none;border-radius:50%;width:56px;height:56px;min-width:56px;display:flex;justify-content:center;align-items:center;cursor:pointer;flex-shrink:0}
.send-btn svg{width:26px;height:26px;stroke:#000}
.icon-btn{background:var(--card);border:1px solid var(--border);border-radius:50%;width:56px;height:56px;min-width:56px;display:flex;justify-content:center;align-items:center;cursor:pointer;color:#fff;flex-shrink:0}
.icon-btn svg{width:28px;height:28px}
.typing{display:flex;gap:4px;padding:8px 16px;flex-shrink:0}.dot{width:8px;height:8px;background:var(--muted);border-radius:50%;animation:blink 1.4s infinite}
@keyframes blink{0%,60%,100%{opacity:0.3}30%{opacity:1}}
.error-modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);display:none;justify-content:center;align-items:center;z-index:200}
.error-box{background:var(--card);border:1px solid var(--border);padding:20px;border-radius:16px;text-align:center}
.btn{background:var(--gradient);color:#000;border:none;padding:12px;border-radius:12px;font-weight:800;width:100%;cursor:pointer}
.bg-btn-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.bg-label{font-size:10px;color:var(--muted)}
.scan-badge{font-size:11px;background:var(--gradient);color:#000;padding:3px 8px;border-radius:10px;font-weight:700;display:inline-flex;align-items:center;gap:4px;margin-bottom:6px}
.net-banner{display:none;padding:8px;text-align:center;font-size:12px;background:#ffaa00;color:#000;font-weight:700;flex-shrink:0}
.preview-modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:300;display:none;flex-direction:column}
.preview-modal.show{display:flex}
.preview-top{padding:calc(14px + env(safe-area-inset-top)) 14px 14px 14px;display:flex;justify-content:space-between;align-items:center}
.preview-img{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0 16px;min-height:0}
.preview-img img{max-width:100%;max-height:100%;border-radius:16px;object-fit:contain}
.preview-bottom{padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--border);display:flex;gap:10px;align-items:center}
.preview-input{flex:1;background:#111;border:1px solid var(--border);color:#fff;padding:14px 16px;border-radius:26px;outline:none;font-size:16px;min-height:52px}
</style>
</head>
<body>
<div id="chat-list-screen">
<header><button class="back-btn" onclick="location.href='index.html'"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><h3>Messages</h3><div style="width:48px"></div></header>
<div class="list" id="chat-list">Loading...</div>
</div>
<div id="chat-screen" style="display:none;flex-direction:column;height:100dvh;height:100svh">
<header class="chat-header">
<div style="display:flex;align-items:center;gap:12px">
<button class="back-btn" onclick="backToList()"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
<div class="avatar" id="chat-avatar"><span id="chat-initial"></span></div>
<div><b id="chat-name"></b><div class="last-seen" id="last-seen"></div></div>
</div>
<div class="bg-btn-wrap">
<svg onclick="changeBackground()" viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4.2 2.1 7.8L12 17l-6.6 4 2.1-7.8L2 9h7l3-7z"/></svg>
<div class="bg-label">Edit BG</div>
</div>
</header>
<div id="net-banner" class="net-banner">Waiting for connection... Your message will send when network returns</div>
<div class="chat-box" id="chat-box"></div>
<div id="typing-indicator" class="typing" style="display:none"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
<div class="input-area">
<button class="icon-btn" onclick="document.getElementById('image-upload').click()" title="Add image">
<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
</button>
<input class="input" id="msg-input" placeholder="Message..." onkeydown="handleTyping(event)">
<button class="send-btn" onclick="sendMessage()"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
</div>
</div>
<div id="image-preview" class="preview-modal">
<div class="preview-top">
<button class="back-btn" onclick="closeImagePreview()"><svg viewBox="0 0 24 24" style="stroke:#fff"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
<b>Add Caption</b><div style="width:48px"></div>
</div>
<div class="preview-img"><img id="preview-img-el" src="" alt=""></div>
<div class="preview-bottom">
<input class="preview-input" id="caption-input" placeholder="Add a caption..." onkeydown="if(event.key==='Enter') sendImageWithCaption()">
<button class="send-btn" onclick="sendImageWithCaption()"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
</div>
</div>
<div id="dm-error" class="error-modal"><div class="error-box"><p id="dm-error-text">DM Locked</p><button class="btn" onclick="closeError()">OK</button></div></div>
<input type="file" id="bg-upload" accept="image/*" style="display:none" onchange="handleBgUpload(event)">
<input type="file" id="image-upload" accept="image/*" style="display:none" onchange="handleImagePick(event)">
<script>
const API='https://golviral-api.onrender.com';
const AI_API='https://golviral.vercel.app/api/chat';
const LOGO_URL='https://golviral.com/icon-192.png';
const TOKEN=localStorage.token;
const MY_USER_ID=localStorage.userId;
if(!TOKEN ||!MY_USER_ID) location.href='auth.html';
const params=new URLSearchParams(location.search);
const toUserId=params.get('user') || params.get('to');
let socket=null, currentChat=null, isGolViralAI=false, lastTyping=0, pendingImageDataUrl=null, pendingImageFile=null;
function getGolViralHistory(){ try{ return JSON.parse(localStorage.getItem('golviral_history')||'[]'); }catch{ return []; } }
function saveGolViralHistory(role,content){ let h=getGolViralHistory(); h.push({role,content}); h=h.slice(-6); localStorage.setItem('golviral_history',JSON.stringify(h)); }
function getLast3(){ return getGolViralHistory().slice(-3); }
function cleanAIReply(t){ if(!t) return ''; return t.replace(/\*\*(.*?)\*\*/g,'$1').replace(/__(.*?)__/g,'$1').replace(/^\s*\|.*\|\s*$/gm,'').replace(/^\s*\|?[\s:\-|]+\|?\s*$/gm,'').replace(/\|/g,' ').replace(/^\s*#{1,6}\s*/gm,'').replace(/\[OCR[^\]]*\]/gi,'').replace(/Tesseract/gi,'').replace(/Optical Character Recognition/gi,'').replace(/\(OCR\)/gi,'').replace(/\n{3,}/g,'\n\n').trim(); }
function escapeHtml(s){ if(!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function linkify(text){
  const escaped = escapeHtml(text);
  const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+)/gi;
  return escaped.replace(urlRegex, (url)=>{
    let href = url; if(!href.startsWith('http')) href = 'https://' + href;
    try{ const u = new URL(href); if(!['http:','https:'].includes(u.protocol)) return url; }catch{ return url; }
    return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${escapeHtml(url)}</a>`;
  });
}
async function copyBubbleText(el, rawText){
  const text = rawText || el.querySelector('.bubble-text')?.innerText || el.innerText || '';
  const clean = text.replace(/\n(Sending\.\.\.|Waiting for network\.\.\.)\s*$/,'').trim();
  if(!clean){ toast('Nothing to copy'); return; }
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(clean);
      toast('Copied');
      return;
    }
    throw new Error('no-clipboard');
  }catch{
    try{
      const ta=document.createElement('textarea'); ta.value=clean; ta.style.position='fixed'; ta.style.left='0'; ta.style.top='0'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, clean.length);
      const ok=document.execCommand('copy'); ta.remove();
      if(ok){ toast('Copied'); return; }
    }catch{}
    toast('Copy failed - long-press to copy');
  }
}
function showScreen(s){ document.getElementById('chat-list-screen').style.display=s==='list'?'block':'none'; document.getElementById('chat-screen').style.display=s==='chat'?'flex':'none'; }
async function api(path,opt={}){ const res=await fetch(API+path,{...opt,headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json',...opt.headers}}); if(res.status===401) location.href='auth.html'; return res.json(); }
function getPending(){ try{ return JSON.parse(localStorage.getItem('golviral_pending')||'[]'); }catch{ return []; } }
function savePending(q){ localStorage.setItem('golviral_pending',JSON.stringify(q)); }
function waitForOnline(){ return new Promise(res=>{ if(navigator.onLine) return res(); const h=()=>{ window.removeEventListener('online',h); res(); }; window.addEventListener('online',h); }); }
// ===== AI HOLDS FOREVER - NO FALLBACK, NO GLITCH =====
// AI calls ONLY AI_API (Vercel). It NEVER calls Render API.
// Real people call ONLY API (Render). Two jobs, two servers, no mixing.
async function fetchAIHold(payload){
  while(true){
    if(!navigator.onLine){
      document.getElementById('net-banner').style.display='block';
      showTyping();
      await waitForOnline();
    }
    try{
      const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),30000);
      const res=await fetch(AI_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:ctrl.signal});
      clearTimeout(timer);
      if(!res.ok) throw new Error('Server '+res.status);
      const data=await res.json();
      if(!data.reply) throw new Error('Empty reply');
      document.getElementById('net-banner').style.display='none';
      return data;
    }catch(e){
      document.getElementById('net-banner').style.display='block';
      showTyping();
      await new Promise(r=>setTimeout(r,3000));
      if(!navigator.onLine) await waitForOnline();
    }
  }
}
async function flushPending(){
  const q=getPending(); if(!q.length) return;
  if(!navigator.onLine) return;
  for(const item of q){
    const data=await fetchAIHold(item.payload);
    hideTyping();
    const clean=cleanAIReply(data.reply);
    addBubble({text:clean,senderId:'golviral-ai',imageUrl:data.imageUrl,createdAt:new Date()});
    saveGolViralHistory('assistant',clean);
  }
  savePending([]);
}
window.addEventListener('online',()=>{ document.getElementById('net-banner').style.display='none'; if(isGolViralAI) flushPending(); });
window.addEventListener('offline',()=>{ if(isGolViralAI) document.getElementById('net-banner').style.display='block'; });
function initSocket(){
  if(socket) try{socket.disconnect();}catch{}
  socket=io(API,{auth:{token:TOKEN},reconnection:true,reconnectionAttempts:10,reconnectionDelay:1000});
  socket.on('connect',()=>console.log('[WS] Connected'));
  socket.on('disconnect',()=>console.log('[WS] Disconnected'));
  socket.on('receive_message',data=>{ if(data.senderId===currentChat || data.receiverId===currentChat) addBubble(data); });
  socket.on('typing',data=>{if(data.from===currentChat) showTyping()});
  socket.on('error_msg', data => { document.getElementById('dm-error-text').innerText = data.error||'DM Locked'; showError(); });
}
async function loadChatList(){
  const res=await api('/api/messages');
  const chats=res.chats||[];
  const listEl=document.getElementById('chat-list');
  const hist=getGolViralHistory();
  const lastAI = hist.length ? hist[hist.length-1].content.slice(0,60) : 'Hey bestie, ask me anything...';
  let html = `<div class="chat-item" id="golviral-ai-item" style="background:rgba(0,255,136,0.06);border-bottom:1px solid var(--border)">
    <div class="avatar"><img src="${LOGO_URL}" alt="GolViral"><div class="online-dot"></div></div>
    <div style="flex:1"><b>GolViral AI</b> <svg style="width:14px;height:14px;stroke:#00ff88;vertical-align:middle" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg><br><small style="color:var(--muted)">${escapeHtml(lastAI)}</small></div>
    <div style="font-size:11px;color:#00ff88">Online</div>
  </div>`;
  if(chats.length===0){ listEl.innerHTML=html+'<div style="padding:20px;text-align:center;color:var(--muted)">No other messages yet</div>'; }
  else { listEl.innerHTML=html+chats.map(c=>{ const username=escapeHtml(c.username||'User'); const initial=username[0].toUpperCase(); return `<div class="chat-item" data-uid="${escapeHtml(c.userId)}" data-name="${username}"><div class="avatar">${initial}</div><div style="flex:1"><b>${username}</b><br><small style="color:var(--muted)">${escapeHtml(c.lastMessage||'No messages yet').slice(0,60)}</small></div></div>`; }).join(''); }
  document.getElementById('golviral-ai-item').addEventListener('click',()=> openGolViralChat());
  listEl.querySelectorAll('.chat-item[data-uid]').forEach(el=>{ el.addEventListener('click',()=> openChat(el.dataset.uid, el.dataset.name)); });
}
function openGolViralChat(){
  isGolViralAI=true; currentChat='golviral-ai';
  document.getElementById('chat-name').innerText='GolViral AI';
  document.getElementById('chat-initial').innerHTML=`<img src="${LOGO_URL}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
  document.getElementById('last-seen').innerText='Online - replies instantly';
  showScreen('chat');
  const bg = localStorage.getItem(`bg_golviral-ai`);
  document.body.style.setProperty('--chat-bg', bg? `url(${bg})` : 'none');
  const box=document.getElementById('chat-box'); box.innerHTML='';
  const hist=getGolViralHistory();
  if(hist.length===0){ addBubble({text:'Hey bestie, I am GolViral AI. How are you today? Want a viral caption, love advice, story, or send me a photo and I will help you with it? I am here for you.',senderId:'golviral-ai',createdAt:new Date()}); }
  else { hist.forEach(h=> addBubble({text:h.content, senderId: h.role==='user'? MY_USER_ID : 'golviral-ai', createdAt:new Date()})); }
  flushPending();
}
async function openChat(userId,username){
  isGolViralAI=false; currentChat=userId;
  document.getElementById('chat-name').innerText=username||'User';
  document.getElementById('chat-initial').innerText=(username||'U')[0].toUpperCase();
  document.getElementById('last-seen').innerText='';
  showScreen('chat');
  const bg = localStorage.getItem(`bg_${userId}`);
  document.body.style.setProperty('--chat-bg', bg? `url(${bg})` : 'none');
  const d=await api(`/api/messages/${userId}`);
  const box=document.getElementById('chat-box'); box.innerHTML=''; (d||[]).forEach(m=>addBubble(m));
}
function backToList(){ showScreen('list'); currentChat=null; isGolViralAI=false; document.body.style.setProperty('--chat-bg','none'); loadChatList(); }
async function sendMessage(){
  const input=document.getElementById('msg-input'); const text=input.value.trim();
  if(!text ||!currentChat) return; if(text.length>1000){ toast('Message too long'); return; } input.value='';
  if(isGolViralAI){
    const historyBefore=getLast3();
    const bubbleId=addBubble({text,senderId:MY_USER_ID,createdAt:new Date(),status:'sending'});
    showTyping();
    const data=await fetchAIHold({message:text,history:historyBefore});
    hideTyping();
    markBubbleSent(bubbleId);
    const clean=cleanAIReply(data.reply);
    addBubble({text:clean,senderId:'golviral-ai',imageUrl:data.imageUrl,createdAt:new Date()});
    saveGolViralHistory('user',text); saveGolViralHistory('assistant',clean);
    return;
  }
  addBubble({text,senderId:MY_USER_ID,receiverId:currentChat,createdAt:new Date()});
  if(socket) socket.emit('send_message',{receiverId:currentChat,text});
}
function handleTyping(e){ if(e && e.key==='Enter'){ sendMessage(); return; } if(Date.now()-lastTyping < 1200) return; lastTyping=Date.now(); if(socket && currentChat && !isGolViralAI) socket.emit('typing',{receiverId:currentChat}); }
function showTyping(){ document.getElementById('typing-indicator').style.display='flex'; }
function hideTyping(){ document.getElementById('typing-indicator').style.display='none'; }
function addBubble(msg){
  const box=document.getElementById('chat-box'); const div=document.createElement('div'); div.className='bubble '+(msg.senderId===MY_USER_ID?'sent':'recv');
  if(msg.status) div.dataset.bubbleId=Date.now()+Math.random();
  const time=new Date(msg.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); const safeText=linkify(msg.text||'');
  let imgHtml = msg.imageUrl ? `<img src="${msg.imageUrl}" alt="image">` : '';
  let scanHtml = '';
  let statusIcon = msg.status==='sending' ? `<svg style="width:12px;height:12px;stroke:#000" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>` : '';
  const hasText = !!(msg.text && msg.text.trim());
  const copyBtnHtml = hasText ? `<div class="bubble-actions"><button class="copy-btn" type="button" title="Copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button></div>` : '';
  div.innerHTML = `${imgHtml}${scanHtml}<span class="bubble-text">${safeText}</span><div class="bubble-time"><span class="status-text">${msg.status==='sending'?'Sending...':''}</span>${statusIcon} ${time}</div>${copyBtnHtml}`; box.appendChild(div); box.scrollTop=box.scrollHeight;
  div.dataset.rawText = msg.text || '';
  const copyBtn = div.querySelector('.copy-btn');
  if(copyBtn){ copyBtn.addEventListener('click',(e)=>{ e.stopPropagation(); copyBubbleText(div, div.dataset.rawText); }); }
  return div.dataset.bubbleId;
}
function markBubbleSent(id){ if(!id) return; const el=document.querySelector(`[data-bubble-id="${id}"]`); if(el){ const s=el.querySelector('.status-text'); if(s) s.innerText=''; const svg=el.querySelector('.bubble-time svg'); if(svg) svg.remove(); } }
function markBubbleWaiting(id){ if(!id) return; const el=document.querySelector(`[data-bubble-id="${id}"]`); if(el){ const s=el.querySelector('.status-text'); if(s) s.innerText='Waiting for network... '; } }
function handleImagePick(e){
  const file=e.target.files[0]; e.target.value=''; if(!file || !currentChat) return; if(file.size>5*1024*1024){ toast('Max 5MB'); return; }
  pendingImageFile=file;
  const reader=new FileReader();
  reader.onload=(ev)=>{ pendingImageDataUrl=ev.target.result; document.getElementById('preview-img-el').src=pendingImageDataUrl; document.getElementById('caption-input').value=''; document.getElementById('image-preview').classList.add('show'); setTimeout(()=>document.getElementById('caption-input').focus(),300); };
  reader.readAsDataURL(file);
}
function closeImagePreview(){ document.getElementById('image-preview').classList.remove('show'); pendingImageDataUrl=null; pendingImageFile=null; }
async function sendImageWithCaption(){
  if(!pendingImageDataUrl || !currentChat) return;
  const caption=document.getElementById('caption-input').value.trim();
  const dataUrl=pendingImageDataUrl; const file=pendingImageFile;
  closeImagePreview();
  const bubbleId=addBubble({text:caption,imageUrl:dataUrl,senderId:MY_USER_ID,createdAt:new Date(),status:'sending'});
  if(isGolViralAI){
    const historyBefore=getLast3();
    showTyping();
    let scannedText='';
    try{ const { data:{ text } } = await Tesseract.recognize(file,'eng'); scannedText=text.trim(); }catch{ scannedText=''; }
    const msgToSend = caption ? caption + (scannedText ? ` ${scannedText}` : '') : (scannedText ? scannedText : 'Analyze this image for GolViral, give caption and viral tips.');
    const data=await fetchAIHold({message:msgToSend,history:historyBefore,imageData:dataUrl,imageText:scannedText});
    hideTyping(); markBubbleSent(bubbleId); const clean=cleanAIReply(data.reply); addBubble({text:clean,senderId:'golviral-ai',createdAt:new Date()}); saveGolViralHistory('user',caption || 'Sent an image'); saveGolViralHistory('assistant',clean);
  } else {
    if(socket) socket.emit('send_message',{receiverId:currentChat,text:caption||'[Image]',imageUrl:dataUrl});
    markBubbleSent(bubbleId);
  }
}
function changeBackground(){ document.getElementById('bg-upload').click(); }
function handleBgUpload(e){
  const file=e.target.files[0]; if(!file) return; if(file.size>5*1024*1024){ toast('Max 5MB'); return; }
  const img=new Image(); const reader=new FileReader();
  reader.onload=ev=>{ img.src=ev.target.result; img.onload=()=>{ const canvas=document.createElement('canvas'); const max=800; let w=img.width, h=img.height; if(w>max || h>max){ const r=Math.min(max/w, max/h); w*=r; h*=r; } canvas.width=w; canvas.height=h; canvas.getContext('2d').drawImage(img,0,0,w,h); const compressed=canvas.toDataURL('image/jpeg',0.6); try{ localStorage.setItem(`bg_${currentChat}`, compressed); document.body.style.setProperty('--chat-bg',`url(${compressed})`); toast('Background updated'); }catch{ toast('Storage full - use smaller image'); } }; };
  reader.readAsDataURL(file); e.target.value='';
}
function toast(msg){ const t=document.createElement('div'); t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(10px);padding:10px 16px;border-radius:12px;border:1px solid var(--border);z-index:400'; t.innerText=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
function showError(){document.getElementById('dm-error').style.display='flex'}
function closeError(){document.getElementById('dm-error').style.display='none'}
if(window.visualViewport){ window.visualViewport.addEventListener('resize',()=>{ const chat=document.getElementById('chat-screen'); if(chat && chat.style.display==='flex'){ document.body.style.height=window.visualViewport.height+'px'; const box=document.getElementById('chat-box'); box.scrollTop=box.scrollHeight; } }); }
document.getElementById('msg-input').addEventListener('focus',()=>{ setTimeout(()=>{ const box=document.getElementById('chat-box'); box.scrollTop=box.scrollHeight; },300); });
initSocket();
if(toUserId){ if(toUserId==='golviral-ai'){ openGolViralChat(); } else { openChat(toUserId, localStorage.getItem(`name_${toUserId}`) || 'User'); } } else { loadChatList(); showScreen('list'); }
</script>
