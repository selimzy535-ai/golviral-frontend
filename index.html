<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="google-site-verification" content="0rn74joHgCCJ0qqgQmbX4H9k1VRvOH31qY_SDkGqLbE" />
  <title>GolViral - Earn Money Creating Short Videos & Stories</title>
  <meta name="theme-color" content="#00ff88">
  <link rel="manifest" href="/golviral-frontend/manifest.json">
  <link rel="apple-touch-icon" href="/golviral-frontend/icon-192.png">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root{--bg:#050505;--card:#0f0f0f;--glass:rgba(15,15,15,0.85);--accent:#00ff88;--purple:#a855f7;--pink:#ec4899;--blue:#3b82f6;--orange:#f97316;--text:#fff;--muted:#888;--border:#1f1f1f;--nav:70px;--top:100px;--gradient:linear-gradient(135deg,#00ff88,#3b82f6,#a855f7)}
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
    body{background:var(--bg);color:var(--text);max-width:500px;margin:0 auto;height:100dvh;overflow:hidden}
    header{height:var(--top);background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:15px}
  .logo{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:900;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .tabs{display:flex;gap:20px;padding:0 15px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
  .tab{color:var(--muted);font-weight:700;cursor:pointer;padding-bottom:10px;white-space:nowrap}
  .tab.active{color:#000;background:var(--gradient);padding:6px 12px;border-radius:20px}
    main{height:calc(100dvh - var(--nav) - var(--top));overflow-y:auto;scroll-snap-type:y mandatory}
  .bottom-nav{height:var(--nav);background:var(--glass);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:0 auto;z-index:10}
  .nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);cursor:pointer;font-size:12px}
  .nav-btn.active{color:var(--accent)}
  .fab{position:fixed;bottom:90px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--gradient);box-shadow:0 0 20px rgba(0,255,136,0.4);border:none;display:flex;justify-content:center;align-items:center;cursor:pointer;z-index:9}
  .reel{height:calc(100dvh - var(--nav) - var(--top));scroll-snap-align:start;position:relative;display:flex;flex-direction:column;justify-content:flex-end}
  .reel video,.reel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  .actions{position:absolute;right:10px;bottom:80px;display:flex;flex-direction:column;gap:18px}
  .action-btn{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;cursor:pointer}
    svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:none;z-index:200}
  .modal.active{display:block}
  .sheet{position:absolute;bottom:0;left:0;right:0;background:var(--bg);border-radius:20px 20px 0 0;padding:16px;max-height:80vh;display:flex;flex-direction:column;border-top:1px solid var(--border)}
  .reader{position:fixed;inset:0;background:var(--bg);transform:translateX(100%);transition:0.3s;z-index:300;padding:20px;overflow-y:auto}
  .reader.active{transform:translateX(0)}
  .input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:24px;outline:none;font-size:14px}
  .btn{background:var(--gradient);color:#000;border:none;padding:8px 16px;border-radius:20px;font-weight:800;cursor:pointer;font-size:12px}
  .toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-100px);background:var(--accent);color:#000;padding:12px 20px;border-radius:20px;font-weight:800;z-index:999;transition:0.3s;opacity:0}
  .toast.show{transform:translate(-50%,0);opacity:1}
  .play-overlay{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,0.3);z-index:5;cursor:pointer}
  .play-overlay svg{width:80px;height:80px;fill:var(--accent);stroke:none}
  .comment-item{display:flex;gap:10px;margin-bottom:12px}
  .comment-avatar{width:34px;height:34px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-weight:bold;color:#000;font-size:12px;flex-shrink:0}
  .comment-bubble{background:var(--card);border:1px solid var(--border);padding:10px 14px;border-radius:16px;max-width:85%}
  .gift-option{display:flex;justify-content:space-between;align-items:center;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;cursor:pointer;margin-bottom:10px}
  .gift-option:hover{border-color:var(--accent)}
  .price-tag{background:var(--card);border:1px dashed var(--border);padding:4px 8px;border-radius:8px;font-size:11px}
  .search-top-panel{position:absolute;top:0;left:0;right:0;background:var(--glass);backdrop-filter:blur(25px);padding:16px;border-bottom:1px solid var(--border);max-width:500px;margin:0 auto}
  .search-header-row{display:flex;align-items:center;gap:12px}
  .search-dropdown-list{max-height:50vh;overflow-y:auto;margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .search-user-card{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:14px;cursor:pointer}
  </style>
</head>
<body>
<div id="toast" class="toast"></div>
<header><div class="topbar"><div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>GolViral</div><svg onclick="openSearch()" viewBox="0 0 24 24" style="cursor:pointer"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div><div class="tabs"><div class="tab active" onclick="loadFeed('ForYou',this)">ForYou</div><div class="tab" onclick="loadFeed('Reels',this)">Reels</div><div class="tab" onclick="loadFeed('Novels',this)">Short Story</div><div class="tab" onclick="loadFeed('Stories',this)">Memes</div></div></header>
<main id="feed"></main>
<button class="fab" onclick="location.href='post.html'"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="bottom-nav">
  <div class="nav-btn active"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Home</span></div>
  <div class="nav-btn" onclick="openSearch()"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><span>Search</span></div>
  <div class="nav-btn" onclick="location.href='post.html'"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Post</span></div>
  <div class="nav-btn" onclick="location.href='messages.html'"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>DM</span></div>
  <div class="nav-btn" onclick="location.href='profile.html'"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Me</span></div>
</nav>

<div id="comment-sheet" class="modal"><div class="sheet"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><b>Comments</b><span onclick="closeSheet()" style="cursor:pointer;color:var(--muted)">✕</span></div><div id="comment-list" style="overflow-y:auto;flex:1"></div><div style="display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--border)"><input id="comment-input" class="input" placeholder="Write a comment..."><button class="btn" onclick="sendComment()">Send</button></div></div></div>
<div id="gift-sheet" class="modal"><div class="sheet"><div style="display:flex;justify-content:space-between;margin-bottom:16px"><b>Send Gift 🎁</b><span onclick="closeGift()" style="cursor:pointer;color:var(--muted)">✕</span></div><div id="gift-list"></div></div></div>

<div id="boost-sheet" class="modal"><div class="sheet">
  <div style="display:flex;justify-content:space-between;margin-bottom:8px"><b id="boost-title">Boost this post 🚀</b><span onclick="closeBoost()" style="cursor:pointer;color:var(--muted)">✕</span></div>
  <p id="boost-desc" style="font-size:13px;color:var(--muted);margin-bottom:14px;background:var(--card);padding:10px;border-radius:10px;border:1px solid var(--border)">You are boosting the post you clicked on.</p>
  <div class="gift-option" onclick="doBoost(3500)"><div><b>1 Day Boost</b><div style="font-size:12px;color:var(--muted)">Top feed for 24h</div></div><div style="text-align:right"><b class="price-amount" data-amount="3500"></b><div class="price-tag"><span class="currency-label">NGN</span> • Fast</div></div></div>
  <div class="gift-option" onclick="doBoost(7500)"><div><b>3 Days Boost</b><div style="font-size:12px;color:var(--muted)">Most popular</div></div><div style="text-align:right"><b class="price-amount" data-amount="7500"></b><div class="price-tag"><span class="currency-label">NGN</span> • Best Value</div></div></div>
  <div class="gift-option" onclick="doBoost(17000)"><div><b>7 Days Boost</b><div style="font-size:12px;color:var(--muted)">Maximum reach</div></div><div style="text-align:right"><b class="price-amount" data-amount="17000"></b><div class="price-tag"><span class="currency-label">NGN</span> • Max</div></div></div>
</div></div>

<div id="search-modal" class="modal"><div class="search-top-panel"><div class="search-header-row"><input id="search-input" class="input" placeholder="Search creators..." oninput="debounceSearch(this.value)"><span onclick="closeSearch()" style="cursor:pointer;color:var(--muted)">Cancel</span></div><div id="search-results" class="search-dropdown-list"></div></div></div>
<div id="reader-tab" class="reader"><svg onclick="closeReader()" viewBox="0 0 24 24" style="margin-bottom:20px;cursor:pointer"><path d="M15 18l-6-6 6-6"/></svg><h2 id="reader-title"></h2><p id="reader-content" style="line-height:1.8;margin-top:16px;white-space:pre-wrap"></p></div>

<script>
const API='https://golviral-api.onrender.com';
const TOKEN=localStorage.token;
const USER_ID=localStorage.userId;
if(!TOKEN) location.href='auth.html';
let feedData=[],currentPost=null,searchTimer=null,currentBoostPostId=null,currentGiftUserId=null;
const userCache={},followLocks={},hlsInstances={};

function detectCurrency(){
  try{
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone||'';
    const lang = navigator.language||'en-NG';
    if(lang.includes('NG')||tz.includes('Lagos')) return {symbol:'₦',code:'NGN',locale:'en-NG'};
    if(lang.includes('US')) return {symbol:'$',code:'USD',locale:'en-US'};
    if(lang.includes('GB')) return {symbol:'£',code:'GBP',locale:'en-GB'};
    if(lang.includes('GH')) return {symbol:'₵',code:'GHS',locale:'en-GH'};
    if(lang.includes('KE')) return {symbol:'KSh',code:'KES',locale:'en-KE'};
    if(lang.includes('ZA')) return {symbol:'R',code:'ZAR',locale:'en-ZA'};
    return {symbol:'₦',code:'NGN',locale:'en-NG'};
  }catch{return {symbol:'₦',code:'NGN',locale:'en-NG'};}
}
const CUR=detectCurrency();
function formatPrice(n){return new Intl.NumberFormat(CUR.locale,{style:'currency',currency:CUR.code,maximumFractionDigits:0}).format(n);}
function applyCurrencyLabels(){
  document.querySelectorAll('.price-amount').forEach(el=>{
    const amt=parseInt(el.dataset.amount); el.innerText=formatPrice(amt);
  });
  document.querySelectorAll('.currency-label').forEach(el=>el.innerText=CUR.code);
}

function toast(m){const t=document.getElementById('toast');t.innerText=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
async function api(p,o={}){try{const r=await fetch(API+p,{...o,headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json',...o.headers}});if(r.status===401) location.href='auth.html';const d=await r.json().catch(()=>({}));if(r.status>=400) return{error:d.error||'Request failed'};return d;}catch{toast('Network error');return{};}}
async function getUser(id){if(userCache[id]) return userCache[id];const u=await api(`/api/user/${id}`);userCache[id]=u;return u;}
async function getSignedUrl(postId){const d=await api(`/api/media/sign?postId=${postId}`);return d?d.url:null;}
async function loadFeed(type,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));if(el) el.classList.add('active');const res=await api('/api/feed');feedData=Array.isArray(res)?res:[];const map={ForYou:'all',Reels:'reel',Novels:'novel',Stories:'store'};const target=map[type];let filtered=target==='all'?feedData:feedData.filter(p=>p.type===target);renderFeed(filtered,type);}
async function renderFeed(posts){const c=document.getElementById('feed');c.innerHTML='';if(!posts||!posts.length){c.innerHTML='<p style="text-align:center;padding:40px;color:var(--muted)">No posts yet</p>';return;}c.style.overflowY='scroll';for(const p of posts){if(p.type==='reel') c.appendChild(await createReel(p));else if(p.type==='store') c.appendChild(await createImageReel(p));else c.appendChild(await createTextReel(p));}setupReelObserver();applyCurrencyLabels();}
async function createReel(p){const div=document.createElement('div');div.className='reel';div.dataset.id=p.id;div.dataset.creator=p.userId;const user=await getUser(p.userId);const isMe=p.userId===USER_ID;div.innerHTML=`<video muted loop playsinline webkit-playsinline preload="metadata" data-postid="${p.id}"></video><div class="play-overlay" style="display:none" onclick="manualPlay(this)"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div><div style="position:relative;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,0.8))"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><b onclick="location.href='profile.html?id=${p.userId}'" style="cursor:pointer">@${user.username||p.userId}</b>${!isMe?`<button class="btn" onclick="toggleFollow('${p.userId}',this)">${user.isFollowing?'Following':'Follow'}</button>`:''}</div><p>${p.caption||''}</p></div><div class="actions"><div class="action-btn" onclick="likePost('${p.id}','${p.userId}',this)"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span id="like-${p.id}">${p.likes||0}</span></div><div class="action-btn" onclick="openComments('${p.id}','${p.userId}')"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><div class="action-btn" onclick="openGiftSheet('${p.userId}')"><svg viewBox="0 0 24 24"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg></div><div class="action-btn" onclick="sharePost()"><svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg></div><div class="action-btn" onclick="openBoostSheet('${p.id}')"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><div class="action-btn" onclick="toggleSound(this)"><svg viewBox="0 0 24 24"><path d="M1 12h3l3-9v18l-3-9H1zm15.54 0c0 3.04-1.63 5.54-3.54 5.54v-11c1.91 0 3.54 2.5 3.54 5.46z"/></svg></div></div>`;let lastTap=0;div.ontouchend=()=>{const now=Date.now();if(now-lastTap<300) likePost(p.id,p.userId,div.querySelector('.action-btn'));lastTap=now;};return div;}
async function createImageReel(p){const div=document.createElement('div');div.className='reel';div.dataset.id=p.id;div.dataset.creator=p.userId;const u=await getUser(p.userId);div.innerHTML=`<img data-postid="${p.id}"><div style="position:relative;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,0.8))"><b>@${u.username||p.userId}</b><p>${p.caption||''}</p></div><div class="actions"><div class="action-btn" onclick="likePost('${p.id}','${p.userId}',this)"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span id="like-${p.id}">${p.likes||0}</span></div><div class="action-btn" onclick="openGiftSheet('${p.userId}')"><svg viewBox="0 0 24 24"><path d="M20 12v10H4V12M2 7h20v5H2z"/></svg></div><div class="action-btn" onclick="openBoostSheet('${p.id}')"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div></div>`;return div;}
async function createTextReel(p){const div=document.createElement('div');div.className=`reel ${p.type}`;div.dataset.id=p.id;div.dataset.creator=p.userId;const u=await getUser(p.userId);div.innerHTML=`<div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px"><h2 style="font-size:28px">${p.title||'Untitled'}</h2><p style="color:var(--muted)">@${u.username||p.userId}</p></div><div class="actions"><div class="action-btn" onclick="likePost('${p.id}','${p.userId}',this)"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span id="like-${p.id}">${p.likes||0}</span></div><div class="action-btn" onclick="openBoostSheet('${p.id}')"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div></div>`;let lastTap=0;div.ontouchend=()=>{const now=Date.now();if(now-lastTap<300) openReader(p.id);lastTap=now;};return div;}
function manualPlay(o){const v=o.parentElement.querySelector('video');if(v){v.play();o.style.display='none';}}
function setupReelObserver(){const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{const video=e.target.querySelector('video');const img=e.target.querySelector('img');const overlay=e.target.querySelector('.play-overlay');const postId=e.target.dataset.id;const creatorId=e.target.dataset.creator;if(e.intersectionRatio>0.7){if(video&&!video.dataset.loaded){video.dataset.loaded="true";getSignedUrl(postId).then(url=>{if(url){if(url.includes('.m3u8')){if(window.Hls&&Hls.isSupported()){const hls=new Hls();hls.loadSource(url);hls.attachMedia(video);hlsInstances[postId]=hls;hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{if(overlay) overlay.style.display='flex';}));}else{video.src=url;video.play();}}else{video.src=url;video.play().catch(()=>{if(overlay) overlay.style.display='flex';});}}});}else if(video) video.play().catch(()=>{if(overlay) overlay.style.display='flex';});if(img&&!img.src){getSignedUrl(postId).then(url=>{if(url) img.src=url;});}api('/api/view',{method:'POST',body:JSON.stringify({postId, userId:creatorId, viewerId:USER_ID})});}else{if(video) video.pause();if(overlay) overlay.style.display='none';}});},{threshold:0.7});document.querySelectorAll('.reel').forEach(r=>obs.observe(r));}
async function likePost(postId,creatorId,btn){if(btn.dataset.locked) return;btn.dataset.locked=1;const span=document.getElementById(`like-${postId}`);if(span) span.innerText=parseInt(span.innerText||0)+1;btn.style.color='var(--pink)';await api('/api/like',{method:'POST',body:JSON.stringify({postId,creatorId})});setTimeout(()=>delete btn.dataset.locked,1000);}
async function toggleFollow(userId,btn){if(followLocks[userId]) return;followLocks[userId]=true;btn.disabled=true;const isF=btn.innerText==='Following';const old=btn.innerText;btn.innerText=isF?'Follow':'Following';const res=await api(isF?'/api/unfollow':'/api/follow',{method:'POST',body:JSON.stringify({followingId:userId})});if(res.error) btn.innerText=old;setTimeout(()=>{btn.disabled=false;delete followLocks[userId];},2000);}
function toggleSound(btn){const v=btn.closest('.reel').querySelector('video');if(v){v.muted=!v.muted;toast(v.muted?'Muted':'Unmuted');}}
function sharePost(){navigator.clipboard.writeText(location.href);toast('Link copied');}

// === GIFT - WITH FIELD LOGIC + CURRENCY ===
function openGiftSheet(userId){
  currentGiftUserId=userId;
  document.getElementById('gift-list').innerHTML=`
    <div class="gift-option" onclick="doGift('RUBY')"><div><b>💎 Ruby - 100 Gifts</b><div style="font-size:12px;color:var(--muted)">200 pts each</div></div><div style="text-align:right"><b class="price-amount" data-amount="5000"></b><div class="price-tag"><span class="currency-label">NGN</span></div></div></div>
    <div class="gift-option" onclick="doGift('GOLD')"><div><b>👑 Gold - 100 Gifts</b><div style="font-size:12px;color:var(--muted)">500 pts each</div></div><div style="text-align:right"><b class="price-amount" data-amount="10000"></b><div class="price-tag"><span class="currency-label">NGN</span></div></div></div>
    <div class="gift-option" onclick="doGift('DIAMOND')"><div><b>💠 Diamond - 100 Gifts</b><div style="font-size:12px;color:var(--muted)">1000 pts each</div></div><div style="text-align:right"><b class="price-amount" data-amount="15000"></b><div class="price-tag"><span class="currency-label">NGN</span></div></div></div>
    <button class="btn" style="width:100%;padding:14px;margin-top:10px" onclick="trySendExistingGift()">I already have pack - Send now 🎁</button>`;
  document.getElementById('gift-sheet').classList.add('active'); applyCurrencyLabels();
}
function closeGift(){document.getElementById('gift-sheet').classList.remove('active');}
document.getElementById('gift-sheet').onclick=e=>{if(e.target.id==='gift-sheet') closeGift();};
async function trySendExistingGift(){if(!currentGiftUserId) return;const res=await api('/api/gift/send',{method:'POST',body:JSON.stringify({receiverId:currentGiftUserId})});if(res.success){toast(`Gift sent! +${res.pointsSent}`);closeGift();}else toast(res.error||'No active pack');}
async function doGift(type){
  if(!currentGiftUserId) return; closeGift();
  const init=await api('/api/gift/init',{method:'POST',body:JSON.stringify({giftType:type})});
  if(init.selarLink && init.token){
    // KEEP FIELD LOGIC - your custom URL works
    localStorage.setItem('last_payment',JSON.stringify({token:init.token,giftType:type,receiverId:currentGiftUserId,type:'gift',currency:CUR.code,symbol:CUR.symbol,at:Date.now()}));
    // backend selarLink already has?custom_field_1=token etc + your custom URL
    toast(`Opening payment for ${type} in ${CUR.code}...`);
    window.open(init.selarLink,'_blank'); // FIELD LOGIC IN LINK
  } else toast(init.error||'Failed');
}

// === BOOST - WITH FIELD LOGIC + FRIENDLY MESSAGE + CURRENCY ===
function openBoostSheet(postId){
  currentBoostPostId=postId;
  const post = feedData.find(p=>p.id===postId);
  const preview = post? (post.caption?.slice(0,45) || post.title?.slice(0,45) || 'this post') : 'this post';
  document.getElementById('boost-title').innerText=`Boost this post 🚀`;
  document.getElementById('boost-desc').innerHTML=`You are about to boost: <b style="color:var(--text)">"${preview}${preview.length>=45?'...':''}"</b><br>This post you clicked on will be pushed to top of ForYou feed and get more views!`;
  document.getElementById('boost-sheet').classList.add('active'); applyCurrencyLabels();
}
function closeBoost(){document.getElementById('boost-sheet').classList.remove('active');}
document.getElementById('boost-sheet').onclick=e=>{if(e.target.id==='boost-sheet') closeBoost();};
async function doBoost(tierAmount){
  if(!currentBoostPostId) return; closeBoost();
  const init=await api('/api/boost/init',{method:'POST',body:JSON.stringify({postId:currentBoostPostId,tierAmount})});
  if(init.selarLink && init.token){
    // FIELD LOGIC BACK: custom_field_1=token, custom_field_2=postId etc + localStorage backup
    localStorage.setItem('last_payment',JSON.stringify({token:init.token,postId:currentBoostPostId,tierAmount,type:'boost',currency:CUR.code,symbol:CUR.symbol,at:Date.now()}));
    toast(`Boosting this post - ${formatPrice(tierAmount)} (${CUR.code})`);
    window.open(init.selarLink,'_blank'); // LINK WITH FIELDS
  } else toast(init.error||'Boost init failed');
}

async function openComments(postId,creatorId){currentPost={postId,creatorId};document.getElementById('comment-sheet').classList.add('active');const d=await api(`/api/comments/${postId}`);const list=document.getElementById('comment-list');list.innerHTML=!d.comments||d.comments.length===0?'<p style="text-align:center;color:var(--muted);padding:20px">No comments yet</p>':d.comments.map(c=>`<div class="comment-item"><div class="comment-avatar">${(c.user?.username||'U')[0].toUpperCase()}</div><div class="comment-bubble"><b style="font-size:13px">@${c.user?.username||'User'}</b><div style="font-size:13px;color:#ddd">${c.text}</div></div></div>`).join('');}
function closeSheet(){document.getElementById('comment-sheet').classList.remove('active');}
document.getElementById('comment-sheet').onclick=e=>{if(e.target.id==='comment-sheet') closeSheet();};
async function sendComment(){const input=document.getElementById('comment-input');const text=input.value.trim();if(!text) return;await api('/api/comment',{method:'POST',body:JSON.stringify({...currentPost,text})});input.value='';openComments(currentPost.postId,currentPost.creatorId);}
function openSearch(){document.getElementById('search-modal').classList.add('active');setTimeout(()=>document.getElementById('search-input').focus(),50);}
function closeSearch(){document.getElementById('search-modal').classList.remove('active');}
document.getElementById('search-modal').onclick=e=>{if(e.target.id==='search-modal') closeSearch();};
function debounceSearch(q){clearTimeout(searchTimer);searchTimer=setTimeout(()=>searchUsers(q),300);}
async function searchUsers(q){const r=document.getElementById('search-results');if(!q||q.length<2){r.innerHTML='';return;}const users=await api(`/api/search/users?q=${encodeURIComponent(q)}`);if(!users||users.length===0){r.innerHTML='<p style="padding:10px;color:var(--muted);text-align:center">No users found</p>';return;}r.innerHTML=users.map(u=>`<div class="search-user-card" onclick="location.href='profile.html?id=${u.id}'"><div><b>@${u.username}</b><div style="font-size:12px;color:var(--muted)">${u.followers||0} followers</div></div><span style="color:var(--accent)">View</span></div>`).join('');}
async function openReader(id){const p=await api(`/api/post/${id}`);document.getElementById('reader-title').innerText=p.title||'No Title';document.getElementById('reader-content').innerText=p.content||'No Content';document.getElementById('reader-tab').classList.add('active');api('/api/read-session',{method:'POST',body:JSON.stringify({contentId:id,authorId:p.userId,contentType:p.type})});}
function closeReader(){document.getElementById('reader-tab').classList.remove('active');}
loadFeed('ForYou',document.querySelector('.tab'));
applyCurrencyLabels();
</script>
